# The Capability Evolution Engine's independent evaluator
# (docs/evolution/DESIGN.md, step 5).
#
# Asks Brain over ssh which experiments are awaiting evaluation, checks out the
# baseline (the production SHA the experiment names) and every variant's pull
# request head, runs the experiment's declared benchmark suite on each with the
# hidden cases only this workflow fetches, records each result back over ssh,
# and asks Brain to decide. Scores are computed by code (`scripts/bench.ts`);
# Brain's `selectVariant` decides on them. It never merges, deploys or closes a
# pull request: adoption goes through the existing release grant.
#
# Trust boundaries, because a variant is code an agent wrote:
#   * The harness is this workflow's own: `bench/` and `scripts/bench.ts` from
#     the canonical checkout are copied over each tree before it runs, so a
#     variant cannot change how it is scored (and a baseline that predates the
#     harness is still measured by it).
#   * Variant code — its `npm ci` and its bench run — executes only inside a
#     throwaway container, never on the runner: no Fly token, no GitHub token,
#     and no process of it survives into the steps that hold one. The bench
#     container has no network, so hidden cases cannot leave except as the
#     result JSON recorded to Brain.
#   * Hidden cases are written outside every worktree, mounted read-only, and
#     never printed: the bench's output goes to a file and only its summary
#     lines reach the log.
#   * Every identifier Brain returns is held to a narrow alphabet
#     (`bench/evaluator.mjs`) before it reaches a shell.
name: Evolution eval

on:
  # Every 30 minutes, off the hour and off the other workflows' minutes.
  schedule:
    - cron: '13,43 * * * *'
    # Every six hours: score production itself on every suite (a standalone baseline), which is
    # what Brain's CAPABILITY_BELOW_TARGET detector reads to find a weakness nobody named.
    - cron: '27 */6 * * *'
  workflow_dispatch:
    inputs:
      experiment:
        description: 'Evaluate only this experiment id (letters, digits, . _ -). Empty evaluates every pending experiment.'
        required: false
        default: ''
      baseline:
        description: 'true: also score production on every suite and record it as the standalone baseline.'
        required: false
        default: 'false'

# Its own group: one evaluation at a time, never evicting or evicted by a console command.
concurrency:
  group: evolution-eval
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  # Only to close a losing variant's pull request after Brain decides.
  pull-requests: write

jobs:
  evaluate:
    name: Evaluate pending experiments
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: ./.github/actions/await-release

      - name: Ask Brain what to evaluate
        id: ask
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EXPERIMENT: ${{ inputs.experiment }}
          BASELINE: ${{ inputs.baseline }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/evolution"
          mkdir -p "$work/hidden" "$work/results"
          chmod 700 "$work" "$work/hidden"
          if [ -n "${EXPERIMENT:-}" ] && ! printf '%s' "$EXPERIMENT" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'; then
            echo "::error::experiment must be letters, digits, '.', '_' or '-'"; exit 1
          fi
          brain=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          on_brain() {
            flyctl ssh console --app "$brain" -C "sh -c 'cd /app && env BRAIN_DATABASE_POOL_SIZE=1 node --import tsx scripts/evolution.ts $1'"
          }
          on_brain "pending --json" > "$work/pending.txt" 2>&1 || { echo "::error::Brain did not answer pending"; tail -20 "$work/pending.txt"; exit 1; }
          node bench/evaluator.mjs plan "$work/pending.txt" "${EXPERIMENT:-}" > "$work/plan.tsv"
          # Production on every suite, as the detector's baseline (kind "production" → record --baseline).
          if [ "${SCHEDULE:-}" = '27 */6 * * *' ] || [ "${BASELINE:-false}" = true ]; then
            head_sha=$(git rev-parse HEAD)
            for suite in feasibility planSpeed; do
              printf 'production\t%s\tproduction\t-\tproduction\t-\t-\t%s\n' "$suite" "$head_sha" >> "$work/plan.tsv"
            done
          fi
          if [ ! -s "$work/plan.tsv" ]; then
            echo "Nothing is awaiting evaluation."
            echo "runs=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "runs=$(wc -l < "$work/plan.tsv")" >> "$GITHUB_OUTPUT"
          # Fetch every commit a run needs now, while a token is in reach and no variant code is.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          : > "$work/targets.tsv"
          while IFS=$'\t' read -r experiment suite kind variant label pr ref sha; do
            if [ "$kind" = variant ] && [ "$sha" = - ]; then
              if [ "$pr" != - ]; then
                git -c http.extraheader="$auth" fetch --quiet --no-tags origin "refs/pull/$pr/head"
              else
                git -c http.extraheader="$auth" fetch --quiet --no-tags origin "refs/heads/$ref"
              fi
              sha=$(git rev-parse FETCH_HEAD)
            else
              git cat-file -e "$sha^{commit}" 2>/dev/null || git -c http.extraheader="$auth" fetch --quiet --no-tags origin "$sha"
              sha=$(git rev-parse "$sha^{commit}")
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$experiment" "$suite" "$kind" "$variant" "$label" "$sha" >> "$work/targets.tsv"
            [ "$kind" = baseline ] && base_sha="$sha"
            if [ "$kind" = variant ]; then
              # The diff size breaks ties toward the smaller change (selectVariant).
              mkdir -p "$work/lines"
              git diff --shortstat "${base_sha:-HEAD}" "$sha" | awk '{n=0; for (i=1;i<=NF;i++) if ($(i+1) ~ /^(insertion|deletion)/) n+=$i; print n}' > "$work/lines/$variant" || echo 0 > "$work/lines/$variant"
            fi
          done < "$work/plan.tsv"
          # The hidden cases of each suite, once, outside every worktree. Never echoed.
          for suite in $(cut -f2 "$work/targets.tsv" | sort -u); do
            on_brain "hidden --suite $suite --json" > "$work/hidden/$suite.txt" 2>&1 || { echo "::error::Brain did not answer hidden cases for $suite"; exit 1; }
            node bench/evaluator.mjs extract "$work/hidden/$suite.txt" > "$work/hidden/$suite.json"
            rm -f "$work/hidden/$suite.txt"
            echo "$suite: $(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).length)' "$work/hidden/$suite.json") hidden case(s)"
          done
          chmod 644 "$work"/hidden/*.json
          cut -f1,3,5,6 "$work/targets.tsv"

      - name: Run the benchmarks (no secrets; variant code only in containers)
        if: steps.ask.outputs.runs != '0'
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/evolution"
          image=node:22-bookworm
          docker pull --quiet "$image" >/dev/null
          n=0
          while IFS=$'\t' read -r experiment suite kind variant label sha; do
            n=$((n + 1))
            wt="$work/tree-$n"
            out="$work/results/$n"
            mkdir -p "$out"
            printf '%s\t%s\t%s\t%s\n' "$experiment" "$kind" "$variant" "$suite" > "$out/target.tsv"
            git worktree add --quiet --detach "$wt" "$sha"
            # The canonical harness scores every tree, the baseline's included.
            rm -rf "$wt/bench" && cp -R bench "$wt/bench" && cp scripts/bench.ts "$wt/scripts/bench.ts"
            ok=1
            timeout 900 docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm \
              -v "$wt:/w" -w /w "$image" npm ci --no-audit --no-fund > "$out/install.log" 2>&1 || ok=0
            if [ "$ok" = 1 ]; then
              timeout 1800 docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
                -v "$wt:/w" -v "$work/hidden:/cases:ro" -v "$out:/out" -w /w "$image" \
                node --import tsx scripts/bench.ts --suite "$suite" --cases "/cases/$suite.json" --out /out/result.json --ref "$(printf "%s/%s" "$experiment" "$label" | cut -c1-100)" --quiet \
                > "$out/bench.log" 2>&1 || ok=0
            fi
            # Only the harness's summary lines reach the log; a hidden case's content never does.
            grep -E '^(feasibility|planSpeed): |^metrics ' "$out/bench.log" 2>/dev/null | cut -c1-2000 || true
            if [ "$ok" != 1 ] || [ ! -s "$out/result.json" ]; then
              echo "::warning::$experiment $kind ${variant} did not complete its $suite bench; recorded as a run with no metrics"
              tail -5 "$out/install.log" 2>/dev/null | cut -c1-300 || true
              node -e 'const [suite, sha, ref] = process.argv.slice(1); console.log(JSON.stringify({ suite, sha, ref, cases: [], metrics: {}, ranAt: new Date().toISOString() }))' \
                "$suite" "$sha" "$(printf "%s/%s" "$experiment" "$label" | cut -c1-100)" > "$out/result.json"
            fi
            echo "$experiment $kind ${variant} ($label @ ${sha:0:12}): done"
            git worktree remove --force "$wt" || rm -rf "$wt"
          done < "$work/targets.tsv"
          # Nothing a variant started outlives this step.
          docker ps -q | xargs -r docker kill >/dev/null 2>&1 || true

      - name: Record results and decide
        if: steps.ask.outputs.runs != '0'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/evolution"
          brain=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          failed=0
          # A result travels as base64 in chunks to a file on the machine, then reaches the CLI on its
          # stdin: no character of it is parsed by a shell, and no single ssh command line carries more
          # than a few kilobytes (one 11 KB command line failed on the first production run, 2026-11-16).
          send_result() {
            local file="$1" args="$2" tmp="/tmp/evr-$(date +%s%N).b64"
            base64 -w0 "$file" | fold -w 3000 > "$RUNNER_TEMP/chunks.txt"
            # Every flyctl here reads /dev/null: inside the loop it would otherwise swallow the chunk file
            # it is reading from (the first production run wrote only the first chunk, 2026-11-16).
            flyctl ssh console --app "$brain" -C "sh -c ': > $tmp'" < /dev/null >/dev/null 2>&1 || return 1
            while IFS= read -r chunk || [ -n "$chunk" ]; do
              flyctl ssh console --app "$brain" -C "sh -c 'printf %s $chunk >> $tmp'" < /dev/null >/dev/null 2>&1 || return 1
            done < "$RUNNER_TEMP/chunks.txt"
            flyctl ssh console --app "$brain" -C "sh -c 'cd /app && base64 -d $tmp | env BRAIN_DATABASE_POOL_SIZE=1 node --import tsx scripts/evolution.ts $args; rc=\$?; rm -f $tmp; exit \$rc'" < /dev/null
          }
          for out in "$work"/results/*/; do
            IFS=$'\t' read -r experiment kind variant suite < "$out/target.tsv"
            flag=""
            if [ "$kind" = production ]; then
              if send_result "$out/result.json" "record --baseline" > "$out/record.txt" 2>&1; then
                echo "recorded production baseline for $suite"
              else
                echo "::error::recording the $suite production baseline failed"; tail -5 "$out/record.txt" | cut -c1-300; failed=1
              fi
              continue
            fi
            [ "$kind" = variant ] && flag="--variant $variant --lines $(tr -cd '0-9' < "$work/lines/$variant" 2>/dev/null || echo 0)"
            if send_result "$out/result.json" "record --experiment $experiment $flag" > "$out/record.txt" 2>&1; then
              echo "recorded $experiment $kind $variant"
            else
              echo "::error::recording $experiment $kind $variant failed"; tail -5 "$out/record.txt" | cut -c1-300; failed=1
            fi
          done
          for experiment in $(cut -f1 "$work/targets.tsv" | grep -v '^production$' | sort -u); do
            flyctl ssh console --app "$brain" -C "sh -c 'cd /app && env BRAIN_DATABASE_POOL_SIZE=1 node --import tsx scripts/evolution.ts decide --experiment $experiment'" > "$work/decide-$experiment.txt" 2>&1 || failed=1
            tail -40 "$work/decide-$experiment.txt"
            # The losing variants' pull requests are closed here, where a token is: Brain records them REJECTED with their scores.
            node bench/evaluator.mjs extract "$work/decide-$experiment.txt" > "$work/decide-$experiment.json" 2>/dev/null || continue
            for pr in $(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); for (const n of d.closePullRequests ?? []) if (/^[0-9]{1,7}$/.test(String(n))) console.log(n)' "$work/decide-$experiment.json"); do
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/$pr" -f state=closed >/dev/null && echo "closed losing variant PR #$pr" || echo "::warning::could not close PR #$pr"
            done
          done
          exit $failed
