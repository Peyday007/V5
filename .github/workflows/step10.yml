# Driving and reading the Step 10 dispatch acceptance, without a terminal.
#
# Separate from `deploy.yml` for the reason `packet-report.yml` is: measuring a
# dispatcher means asking the same questions repeatedly — how many bins are
# ready, what did the provider say, how long did they wait — and asking them
# through the deploy pipeline would cost a build, a redeploy and a restart every
# time.
#
# Every subcommand is either a read or an operator action a person is already
# authorized to take, and all of them are confined to the harness's own
# acceptance project.
name: Step 10

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'setup | seed | report | tick | reconcile | standards | fire-check | prompt | trace | watch | ramp | cancel-ready | cancel-bin | regrant | probe | probe-read | recover | admins | gap-policy | cf8 | research-start | research-ready'
        required: true
        default: report
      arg1:
        description: 'First argument (bins to seed, a bin id, or seconds to watch)'
        required: false
        default: ''
      arg2:
        description: 'Second argument (units per bin, or the poll interval)'
        required: false
        default: ''
      arg3:
        description: 'Third argument (a ramp rung deadline, in seconds)'
        required: false
        default: ''

# Never at the same time as a deploy: the machine is being replaced during one,
# and a measurement that raced a restart would be measuring whichever half
# answered.
concurrency:
  group: deploy-brain
  cancel-in-progress: false

jobs:
  step10:
    name: Step 10 harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # A rung of the ramp watches from inside the machine until the fleet
      # settles, so this step outlives a snapshot by design. The cap is the
      # harness's own deadline plus room for the connection itself.
      - name: Run
        timeout-minutes: 60
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Through the environment, never interpolated into the shell: an
          # input pasted into a command line is an injection whatever the
          # dispatcher intended, and the guard should not be "only I can run
          # this workflow".
          STEP10_COMMAND: ${{ inputs.command }}
          STEP10_ARG1: ${{ inputs.arg1 }}
          STEP10_ARG2: ${{ inputs.arg2 }}
          STEP10_ARG3: ${{ inputs.arg3 }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          for value in "$STEP10_COMMAND" "$STEP10_ARG1" "$STEP10_ARG2" "$STEP10_ARG3"; do
            case "$value" in
              ''|*[!A-Za-z0-9_-]*)
                if [ -n "$value" ]; then
                  echo "::error::Refusing '$value': arguments are letters, digits, dash and underscore."
                  exit 1
                fi
                ;;
            esac
          done
          set +e
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/step10.sh $STEP10_COMMAND $STEP10_ARG1 $STEP10_ARG2 $STEP10_ARG3" \
            2>&1 | tee step10.txt
          set -e
          grep -q '^STEP10: OK' step10.txt
