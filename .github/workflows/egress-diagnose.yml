# One-off, read-only egress diagnostic.
#
# Opens a single Postgres session from inside the production machine, sets it
# READ ONLY, and runs SELECTs only: pg_stat_statements, row counts and table
# sizes. It writes no row, creates nothing, changes no setting, and deploys
# nothing. The script travels base64-encoded and is piped to node on stdin, so
# nothing is written to the machine's disk.
name: Egress diagnose
# snapshot: T2b (pre-deploy)

on:
  push:
    branches:
      - 'claude/optimistic-knuth-9elc7d'
    paths:
      - '.github/workflows/egress-diagnose.yml'

concurrency:
  group: brain-console-egress-diagnose
  cancel-in-progress: false

jobs:
  read:
    name: Read pg_stat_statements and table sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: ./.github/actions/await-release
      - name: Read
        timeout-minutes: 20
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "sh -c 'echo  | base64 -d | node -'" \
            2>&1 | tee diag.txt
          set -e
          grep -q '^EGRESS-DIAG: OK' diag.txt
