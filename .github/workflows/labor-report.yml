# Reading one project's labor map from the authoritative rows, without a
# terminal and without a person relaying them.
#
# `cash-report.yml` answers "where is the sprint"; this answers the question
# §41 added the axis for: **who or what actually produces each piece of work
# here, what is still standing between a task and Brain, and which of those is
# waiting on a person.**
#
# It prints the running artifact's own `BRAIN_REVISION` before anything else.
# That is the point rather than a header: a report read out of a container says
# nothing about *which* container unless the container says which commit it was
# built from, and a deployment system's label is a claim about what it was
# asked to ship rather than a reading of what is serving.
#
# It is read-only: it opens the database, prints, and closes. No deploy, no
# restart, no migration, no write — `scripts/labor-report.ts` performs no
# INSERT, UPDATE or DELETE and starts no round. The one thing it can do to
# production is read it.
name: Labor report

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Optional project id (prj_...). Omit to report every project that has a labor map.'
        required: false
        default: ''

# ---------------------------------------------------------------------------
# Why this is not in the `deploy-brain` group, and why that is not a hole
# ---------------------------------------------------------------------------
#
# It was. The reasoning written here said "never at the same time as a deploy:
# the machine is being replaced during one, and a report that raced a restart
# would be reporting whichever half answered." That is a sound-sounding
# sentence and it is **wrong about this Brain**, which `closeout-report.yml`
# established first and this file is adopting rather than re-deriving:
# **the database is not on the machine.** In cloud mode the rows are in
# Supabase Postgres and the documents are in the bucket (§18), so a restart
# does not change what this reads. What a restart can do is interrupt the ssh
# session, and that fails loudly at the `grep` below — a missing
# `LABOR-REPORT: OK` line — rather than quietly reporting half a Brain.
#
# The measured cost of the old group is that the read cannot be taken at all.
# GitHub keeps exactly one *pending* run per group, so a new dispatch cancels
# the one that was waiting; with a dozen sessions working this repository at
# once, a deploy plus the next dispatch behind it is enough. A reading you
# cannot take is not a control, it is a reading nobody has — §29's defect at a
# concurrency key.
#
# So it shares the read-only group instead of carrying its own. That is
# deliberate: the serialization worth keeping is not against deploys, it is
# against *other reads*, because the binding limit on this Brain is the
# Supabase pooler's shared client count and not anything on the machine. One
# read at a time over that limit is the whole point, and it is the same reason
# the script below asks for a pool of one.
concurrency:
  group: closeout-report
  cancel-in-progress: false

jobs:
  report:
    name: Read the labor map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Report
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          args=""
          if [ -n "${{ inputs.project }}" ]; then
            args="--project ${{ inputs.project }}"
          fi
          set +e
          # The pool size is set here as well as in the script, because the
          # workflow runs from the checked-out repository and the script runs
          # from the image — so this one takes effect without a deploy, which
          # is what matters when the pooler is already tight.
          flyctl ssh console --app "$app" \
            -C "env BRAIN_DATABASE_POOL_SIZE=1 sh /app/scripts/labor-report.sh $args" \
            2>&1 | tee labor-report.txt
          set -e
          grep -q '^LABOR-REPORT: OK' labor-report.txt
