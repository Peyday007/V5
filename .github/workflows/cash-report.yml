# Reading a Cash sprint's authoritative rows, without a terminal and without a
# person relaying them.
#
# `packet-report.yml` answers "what does this packet hold" and this answers the
# same question one altitude up: is the sprint running, what does its own
# authorization permit, is a commercial grant present, where is every discovery
# round, what is in the queue, and what has reached the portfolio.
#
# It exists because the audit that found the Cash pipeline had never run to the
# end had to ship a scratch query runner into the container to ask, and a
# question worth asking once about a live sprint is worth being able to ask
# again. A scratch runner is also the thing you can get wrong: this one is
# committed, reviewed and read-only in the script as well as here.
#
# It is read-only: it opens the database, prints, and closes. No deploy, no
# restart, no migration, no write. The one thing it can do to production is read
# it.
name: Cash report

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Optional project id (prj_...). Omit to report every project running a sprint.'
        required: false
        default: ''
      sections:
        description: 'Optional comma-separated section headings to surface first.'
        required: false
        default: ''

# Never at the same time as a deploy: the machine is being replaced during one,
# and a report that raced a restart would be reporting whichever half answered.
concurrency:
  group: brain-console-cash-report
  cancel-in-progress: false

jobs:
  report:
    name: Read the sprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Wait for a release, rather than racing one.
      #
      # This workflow used to share `deploy-brain` with the deploy and with
      # every other operator command, which kept it off a machine mid-release
      # and *also* let it silently cancel a queued deploy — GitHub keeps one
      # pending run per group and the newest evicts the one that was waiting.
      # The group is this workflow's own now, so nothing here can evict
      # anything; this step is the half of the old group that was worth
      # keeping. See `.github/actions/await-release/action.yml`.
      - uses: ./.github/actions/await-release

      - name: Report
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          args=""
          if [ -n "${{ inputs.project }}" ]; then
            args="--project ${{ inputs.project }}"
          fi
          set +e
          flyctl ssh console --app "$app" \
            -C "env BRAIN_DATABASE_POOL_SIZE=1 BRAIN_DATABASE_CONNECT_TIMEOUT_MS=60000 sh /app/scripts/cash-report.sh $args" \
            2>&1 | tee cash-report.txt
          set -e
          grep -q '^CASH-REPORT: OK' cash-report.txt

      # The report as annotations, so it can be read through the API.
      #
      # A session reading production had only the API: the run's log is served
      # from a storage host its network policy refuses, so `cash-report.txt`
      # could not be read at all and "is the operation off?" had no answer.
      # Annotations are part of the check run, which the API returns. Read-only,
      # and `always()` so a failed report is readable too.
      - name: Surface the report
        if: always()
        env:
          SECTIONS: ${{ inputs.sections }}
        run: |
          [ -f cash-report.txt ] || exit 0
          python3 - <<'PY'
          # GitHub keeps about 4 KB of an annotation and 10 notices a step, so
          # the report goes out as its top-level sections (a line with no
          # leading space starts one), the ones that answer "is it working"
          # first, each cut to what one annotation holds.
          import re
          text = open('cash-report.txt', encoding='utf-8', errors='replace').read()
          sections, current = [], []
          for line in text.splitlines():
              if line and not line[0].isspace() and current:
                  sections.append(current); current = []
              current.append(line)
          if current:
              sections.append(current)
          import os
          wanted = tuple(w.strip() for w in os.environ.get('SECTIONS', '').split(',') if w.strip())
          first = wanted + ('SERVING_REVISION', 'CASH-REPORT', 'MARKETPLACE', 'JOBS', 'AUTHORIZ', 'FUNNEL', 'PORTFOLIO', 'MONEY')
          def rank(section):
              head = section[0]
              for n, word in enumerate(first):
                  if head.startswith(word):
                      return n
              return len(first)
          chosen = sorted(sections, key=rank)[:10]
          for section in chosen:
              body = '\n'.join(section)[:3900]
              body = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              title = re.sub(r'[^A-Za-z0-9 _.-]', '', section[0])[:60] or 'section'
              print(f'::notice title={title}::{body}')
          PY
