# The cheap lane's switchboard (OmniRoute), and connecting the Brain to it.
#
#   deploy  — create or update the separate `northline-cheap` Fly app. Its
#             dashboard password is the OMNIROUTE_PASSWORD repository secret;
#             without it nothing is deployed, so the dashboard is never left on
#             its default password.
#   connect — point the Brain at it: sets BRAIN_CHEAP_LLM_URL, _KEY and
#             _MODELS on the Brain from the OMNIROUTE_API_KEY and
#             OMNIROUTE_MODEL secrets (the endpoint key and combo a person
#             created in the dashboard). Setting secrets restarts the Brain.
#   disconnect — remove them; the lane is off again, nothing else changes.
#
# No key is printed. Free provider keys never pass through here: they are
# entered in OmniRoute's own dashboard.
name: Cheap lane

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | connect | disconnect'
        required: true
        default: deploy

concurrency:
  group: cheap-lane
  cancel-in-progress: false

jobs:
  cheap:
    name: Cheap lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: ./.github/actions/await-release
      - name: Run
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          OMNIROUTE_PASSWORD: ${{ secrets.OMNIROUTE_PASSWORD }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          ACTION: ${{ inputs.action }}
        run: |
          set -eu
          brain=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          cheap=northline-cheap
          case "$ACTION" in
            deploy)
              # Not `flyctl deploy`: exactly one workflow ships the Brain
              # (deploymentOwnership), and this is a different app. It runs one
              # machine from OmniRoute's published image, created once and
              # updated in place after.
              [ -n "$OMNIROUTE_PASSWORD" ] || { echo "::error::Set the OMNIROUTE_PASSWORD repository secret first."; exit 1; }
              image=diegosouzapw/omniroute:latest
              flyctl apps list --json | grep -q "\"$cheap\"" || flyctl apps create "$cheap"
              flyctl volumes list --app "$cheap" --json | grep -q omniroute_data \
                || flyctl volumes create omniroute_data --app "$cheap" --region iad --size 1 --yes
              flyctl ips list --app "$cheap" --json | grep -q '"v6"' || flyctl ips allocate-v6 --app "$cheap"
              flyctl ips list --app "$cheap" --json | grep -q 'shared_v4\|"v4"' || flyctl ips allocate-v4 --shared --app "$cheap" --yes
              machine=$(flyctl machine list --app "$cheap" --json | grep -o '"id": *"[0-9a-f]*"' | head -1 | grep -o '[0-9a-f]\{8,\}' || true)
              if [ -n "$machine" ]; then
                flyctl machine update "$machine" --app "$cheap" --image "$image" \
                  --env INITIAL_PASSWORD="$OMNIROUTE_PASSWORD" --yes
              else
                flyctl machine run "$image" --app "$cheap" --region iad --name omniroute \
                  --vm-size shared-cpu-1x --vm-memory 512 \
                  --volume omniroute_data:/app/data \
                  --env PORT=20128 --env HOSTNAME=0.0.0.0 --env INITIAL_PASSWORD="$OMNIROUTE_PASSWORD" \
                  --port 443:20128/tcp:tls:http --port 80:20128/tcp:http \
                  --restart always
              fi
              echo "::notice title=cheap lane::OmniRoute is at https://$cheap.fly.dev — sign in with OMNIROUTE_PASSWORD, add providers, make a combo and an endpoint key."
              ;;
            connect)
              [ -n "$OMNIROUTE_API_KEY" ] || { echo "::error::Set the OMNIROUTE_API_KEY repository secret (an endpoint key from the OmniRoute dashboard)."; exit 1; }
              model="${OMNIROUTE_MODEL:-auto}"
              flyctl secrets set --app "$brain" \
                BRAIN_CHEAP_LLM_URL="https://$cheap.fly.dev/v1" \
                BRAIN_CHEAP_LLM_KEY="$OMNIROUTE_API_KEY" \
                BRAIN_CHEAP_LLM_MODELS="$model" >/dev/null
              echo "::notice title=cheap lane::The Brain now sends grunt work to the cheap lane (models: $model)."
              ;;
            disconnect)
              flyctl secrets unset --app "$brain" BRAIN_CHEAP_LLM_URL BRAIN_CHEAP_LLM_KEY BRAIN_CHEAP_LLM_MODELS >/dev/null
              echo "::notice title=cheap lane::The cheap lane is off."
              ;;
            *) echo "::error::Unknown action '$ACTION'."; exit 1 ;;
          esac
