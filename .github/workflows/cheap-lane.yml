# The cheap lane's switchboard (OmniRoute), and connecting the Brain to it.
#
#   deploy  — create or update the separate `northline-cheap` Fly app. Its
#             dashboard password is the OMNIROUTE_PASSWORD repository secret;
#             without it nothing is deployed, so the dashboard is never left on
#             its default password.
#   connect — point the Brain at it: sets BRAIN_CHEAP_LLM_URL, _KEY and
#             _MODELS on the Brain from the OMNIROUTE_API_KEY and
#             OMNIROUTE_MODEL secrets (the endpoint key and combo a person
#             created in the dashboard). Setting secrets restarts the Brain.
#   disconnect — remove them; the lane is off again, nothing else changes.
#   claude-discovery-off / claude-discovery-on — stop or resume Claude Routines
#             opening broad discovery rounds (BRAIN_CLAUDE_DISCOVERY), so they
#             spend their capacity on deep dives and research goals.
#   focus / unfocus — focus also caps cash deep dives and monetization
#             questions at one at a time (BRAIN_CASH_RESEARCH_MAX=1) and stops
#             broad discovery, so Routines work on what improves every job.
#
#   runpod-test — probe the RunPod GPU (repository secrets RUNPOD_VLLM_URL,
#             RUNPOD_VLLM_KEY, optional RUNPOD_VLLM_MODEL) with Brain's own lane
#             code: refuses no key, serves the model, real task, 4 in parallel,
#             a research-sized prompt. Nothing on the Brain changes.
#   runpod-connect — probe, and only if it passes put the GPU in slot A
#             (BRAIN_RUNPOD_* on the Brain, mode primary). The free providers
#             stay as slot B and as the GPU's fallback.
#   runpod-disconnect — back to free providers only (mode off).
#   runpod-report — research jobs by model on production, and GPU fallbacks.
#   runpod-cycle — the production test of automatic power: stop the pod, watch
#             Brain start it again for waiting research, wait for vLLM to serve.
#   runpod-restore — find Brain's pod, or recreate it from the recipe in
#             `cheap/runpodRestore.ts` (same GPU, image, model, no paid volume,
#             refused above RUNPOD_MAX_USD_PER_HOUR), wait for vLLM, probe, connect.
#   runpod-auto — what the hourly schedule runs: nothing until the RUNPOD_*
#             secrets exist; then probe and connect on its own; once connected,
#             reconnect if the secrets change, and report the GPU's research jobs.
#             With RUNPOD_API_KEY, a deleted pod is recreated first (runpod-restore).
#
# No key is printed. Free provider keys never pass through here: they are
# entered in OmniRoute's own dashboard.
name: Cheap lane

on:
  # The GPU connects itself: the first hourly run after the RUNPOD_* secrets
  # exist probes it and, on a pass, connects it (runpod-auto).
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy | status | prune | test | connect | disconnect | claude-discovery-off | claude-discovery-on | focus | unfocus | runpod-test | runpod-connect | runpod-disconnect | runpod-report | runpod-auto | runpod-cycle | runpod-restore | runpod-survey | runpod-bench | runpod-upgrade | runpod-repurpose'
        required: true
        default: deploy
      recipes:
        description: 'For runpod-bench: comma-separated pod recipes (server/services/cheap/runpodRestore.ts RECIPES) to benchmark on temporary pods; add "baseline" to measure production too. For runpod-upgrade: the one recipe to serve.'
        required: false
        default: ''
      hours:
        description: 'For runpod-report: the window in hours (1-48). The report also prints the equal window before it, for a before/after reading.'
        required: false
        default: '6'

concurrency:
  group: cheap-lane
  cancel-in-progress: false

jobs:
  cheap:
    name: Cheap lane
    runs-on: ubuntu-latest
    # A Deploy that replaces the machine mid-command can leave `flyctl ssh`
    # waiting on a dead session for the runner's six hours, holding this
    # workflow's concurrency group the whole time (2026-11-06: a runpod-report
    # and a connection report hung 66 and 25 minutes, queueing every later one).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: ./.github/actions/await-release
        with:
          # This workflow restarts the Brain, so it waits out the hosted
          # verification too, not only the machine replacement.
          whole-job: 'true'
          timeout-seconds: '2700'
      # Only the RunPod actions run Brain's own code here (the probe).
      - uses: actions/setup-node@v4
        if: startsWith(inputs.action || 'runpod-auto', 'runpod-')
        with:
          node-version: 22
          cache: npm
      - if: startsWith(inputs.action || 'runpod-auto', 'runpod-')
        run: npm ci --no-audit --no-fund
      - name: Run
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # The Brain's deploy token can only touch the Brain's app; creating a
          # second app needs an organization token (Fly dashboard → Tokens).
          FLY_ORG_TOKEN: ${{ secrets.FLY_ORG_TOKEN }}
          OMNIROUTE_PASSWORD: ${{ secrets.OMNIROUTE_PASSWORD }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          RUNPOD_VLLM_URL: ${{ secrets.RUNPOD_VLLM_URL }}
          RUNPOD_VLLM_KEY: ${{ secrets.RUNPOD_VLLM_KEY }}
          RUNPOD_VLLM_MODEL: ${{ secrets.RUNPOD_VLLM_MODEL }}
          # The RunPod account key (not vLLM's --api-key): lets Brain stop an idle pod and start it for new work.
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          # The pod's hourly price (a repository variable, not a secret), for cost per research job.
          RUNPOD_USD_PER_HOUR: ${{ vars.RUNPOD_USD_PER_HOUR }}
          # The most a recreated pod may cost (a repository variable); unset = the measured $0.24/h.
          RUNPOD_MAX_USD_PER_HOUR: ${{ vars.RUNPOD_MAX_USD_PER_HOUR }}
          ACTION: ${{ inputs.action || 'runpod-auto' }}
          HOURS_INPUT: ${{ inputs.hours || '6' }}
          RECIPES_INPUT: ${{ inputs.recipes || '' }}
        run: |
          set -eu
          exec > >(tee cheap.txt) 2>&1
          brain=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          # Digits only, bounded: it is spliced into a remote command line.
          HOURS=$(printf '%s' "$HOURS_INPUT" | tr -cd '0-9')
          case "$HOURS" in ''|0) HOURS=6 ;; esac
          [ "$HOURS" -gt 48 ] && HOURS=48
          cheap=northline-cheap
          # The GPU's settings, fingerprinted so a changed secret is noticed without reading one back.
          fingerprint() { gpu_fp=$(printf '%s\n%s\n%s\n%s' "$RUNPOD_VLLM_URL" "$RUNPOD_VLLM_KEY" "$RUNPOD_VLLM_MODEL" "${RUNPOD_API_KEY:-}" | sha256sum | cut -c1-16); }
          fingerprint
          # The pod's address is read from RunPod, not from the secret, so a pod
          # RunPod deleted (an empty balance, 2026-11-10) is recreated and found
          # without anyone editing a secret. Never starts or stops a pod.
          pod_id=''
          restore() {
            [ -n "${RUNPOD_API_KEY:-}" ] || return 0
            rc=0; npx tsx scripts/runpod-restore.ts "$@" > restore.txt 2>&1 || rc=$?
            cat restore.txt
            if grep -q '^RUNWAY-LOW ' restore.txt; then echo "::warning title=runpod balance::RunPod's balance lasts about $(grep '^RUNWAY-LOW ' restore.txt | cut -d' ' -f2) hours at the current spend; RunPod deletes every pod at zero. Add funds to the RunPod account."; fi
            [ $rc -eq 0 ] || { echo "::error title=runpod::No GPU pod could be found or recreated; the lines above give RunPod's answer."; return $rc; }
            url=$(grep '^URL ' restore.txt | cut -d' ' -f2-)
            pod_id=$(grep '^POD ' restore.txt | cut -d' ' -f2)
            grep -q '^CREATED ' restore.txt && echo "::notice title=runpod::Recreated the GPU pod ($(grep '^POD ' restore.txt | cut -d' ' -f2-)/h)."
            [ -n "$url" ] && RUNPOD_VLLM_URL="$url"
            fingerprint
          }
          probe() { rc=0; npx tsx scripts/runpod-probe.ts > probe.txt 2>&1 || rc=$?; cat probe.txt; return $rc; }
          gpu_connect() {
            model=$(grep '^MODEL ' probe.txt | cut -d' ' -f2-)
            flyctl secrets set --app "$brain" \
              BRAIN_RUNPOD_URL="$RUNPOD_VLLM_URL" \
              BRAIN_RUNPOD_KEY="$RUNPOD_VLLM_KEY" \
              BRAIN_RUNPOD_MODEL="$model" \
              BRAIN_RUNPOD_FINGERPRINT="$gpu_fp" \
              BRAIN_RUNPOD_TOOLS="$(grep -q '^TOOLS on' probe.txt && echo on || echo off)" \
              BRAIN_RUNPOD_CONTEXT="$(grep '^CONTEXT ' probe.txt | cut -d' ' -f2 | tr -cd '0-9')" \
              BRAIN_RUNPOD_MODE=primary >/dev/null
            [ -z "$pod_id" ] || flyctl secrets set --app "$brain" BRAIN_RUNPOD_POD_ID="$pod_id" >/dev/null
            if [ -n "${RUNPOD_API_KEY:-}" ]; then
              flyctl secrets set --app "$brain" BRAIN_RUNPOD_API_KEY="$RUNPOD_API_KEY" >/dev/null
              echo "::notice title=runpod::Auto stop/start on: Brain stops the pod after 15 idle minutes and starts it when research arrives."
            else
              echo "::warning title=runpod::No RUNPOD_API_KEY secret: the pod is never stopped automatically, and bills while idle."
            fi
            echo "::notice title=runpod::Connected. Slot A of the free lane is now the GPU ($model); free providers are slot B and its fallback."
          }
          gpu_report() {
            price=$(printf '%s' "${RUNPOD_USD_PER_HOUR:-}" | tr -cd '0-9.')
            flyctl ssh console --app "$brain" -C "env BRAIN_RUNPOD_USD_PER_HOUR=${price:-0} sh /app/scripts/runpod-report.sh --hours ${HOURS:-6}" | tee report.txt || true
            fb=$(flyctl logs --app "$brain" --no-tail 2>&1 | grep -c '\[runpod\] fallback' || true)
            grep -q 'RUNPOD-REPORT: OK' report.txt || echo "::warning title=runpod::The report did not finish (no RUNPOD-REPORT: OK); its counts are partial."
            echo "GPU fallbacks in the recent log: $fb"
            q=$(grep -A20 '^RESEARCH QUALITY' report.txt | grep 'runpod/' | head -1 | sed 's/^ *//' || true)
            [ -z "$q" ] || echo "::notice title=runpod quality::$q"
            c=$(grep '^GPU COST' report.txt | head -1 || true)
            [ -z "$c" ] || echo "::notice title=runpod cost::$c"
            n=$(grep '^RUNPOD_SUBMITTED ' report.txt | cut -d' ' -f2 || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "::notice title=runpod::Research jobs on the GPU: ${n} submitted in the last ${HOURS:-6}h (fallbacks in log: $fb)."
            else
              echo "::warning title=runpod::No research job submitted on the GPU in the last ${HOURS:-6}h yet (fallbacks in log: $fb)."
            fi
          }
          # The gateway keeps a JSON file per call and rotated application logs on
          # a 1 GB volume. Production, 2026-11-09: they filled it (call_logs 276 MB
          # in one day, logs 260 MB), every call failed "database or disk is full",
          # and the free lane sat idle for ten hours beside 76 waiting research items.
          # Its own debugging output is pruned every hour; its database is not touched.
          gateway_prune() {
            [ -n "${FLY_ORG_TOKEN:-}" ] || { echo "::warning title=cheap lane::No FLY_ORG_TOKEN: the gateway's logs were not pruned."; return 0; }
            FLY_API_TOKEN="$FLY_ORG_TOKEN" flyctl ssh console --app "$cheap" -C "sh -c 'find /app/data/call_logs -type f -mmin +120 -delete 2>/dev/null; find /app/data/call_logs -mindepth 1 -type d -empty -delete 2>/dev/null; ls -1t /app/data/logs/application/app.*.log 2>/dev/null | tail -n +3 | xargs -r rm -f; df -h /app/data | tail -1'" \
              || echo "::warning title=cheap lane::The gateway prune did not run."
          }
          case "$ACTION" in
            runpod-test)
              [ -n "$RUNPOD_VLLM_URL" ] || { echo "::error::Set the RUNPOD_VLLM_URL and RUNPOD_VLLM_KEY repository secrets."; exit 1; }
              restore
              probe
              ;;
            runpod-connect)
              [ -n "$RUNPOD_VLLM_URL" ] || { echo "::error::Set the RUNPOD_VLLM_URL and RUNPOD_VLLM_KEY repository secrets."; exit 1; }
              restore
              probe || { echo "::error::The GPU did not pass the probe; nothing on the Brain changed."; exit 1; }
              gpu_connect
              ;;
            runpod-disconnect)
              flyctl secrets set --app "$brain" BRAIN_RUNPOD_MODE=off >/dev/null
              echo "::notice title=runpod::The GPU is out of the lane; free providers only."
              ;;
            runpod-report)
              gpu_report
              ;;
            runpod-survey)
              # What the account holds and could rent, from RunPod itself (§108). Changes nothing.
              [ -n "${RUNPOD_API_KEY:-}" ] || { echo "::error::Set the RUNPOD_API_KEY repository secret."; exit 1; }
              npx tsx scripts/runpod-survey.ts
              ;;
            runpod-repurpose)
              # Serve a recipe on the existing pod in place (§108): same host and GPU, no second pod.
              [ -n "${RUNPOD_API_KEY:-}" ] && [ -n "$RUNPOD_VLLM_KEY" ] || { echo "::error::Set the RUNPOD_API_KEY and RUNPOD_VLLM_KEY repository secrets."; exit 1; }
              recipe=$(printf '%s' "$RECIPES_INPUT" | tr -cd 'a-z0-9.,-')
              rc=0; npx tsx scripts/runpod-repurpose.ts --recipe "$recipe" | tee repurpose.txt || rc=$?
              RUNPOD_VLLM_URL=$(grep '^URL ' repurpose.txt | tail -1 | cut -d' ' -f2-)
              RUNPOD_VLLM_MODEL=""
              pod_id=$(grep '^POD ' repurpose.txt | cut -d' ' -f2)
              fingerprint
              # Connected either way: a reverted pod serves its old recipe and the Brain must point at what it serves.
              probe || true
              grep -q '^MODEL ' probe.txt && gpu_connect
              [ $rc -eq 0 ] && grep -q '^TOOLS on' probe.txt || { echo "::error title=runpod::Recipe $recipe did not come up with tool calls; the previous recipe was put back."; exit 1; }
              echo "::notice title=runpod::Pod $pod_id now serves $recipe with tool calls ($(grep '^CONTEXT ' probe.txt | cut -d' ' -f2) context)."
              ;;
            runpod-upgrade)
              # Move the GPU to another recipe with no gap (§108): new pod beside the old, probe
              # (tool calls included), point the Brain at it, then retire the old one.
              [ -n "${RUNPOD_API_KEY:-}" ] && [ -n "$RUNPOD_VLLM_KEY" ] || { echo "::error::Set the RUNPOD_API_KEY and RUNPOD_VLLM_KEY repository secrets."; exit 1; }
              recipe=$(printf '%s' "$RECIPES_INPUT" | tr -cd 'a-z0-9.-')
              npx tsx scripts/runpod-upgrade.ts --recipe "$recipe" | tee upgrade.txt || { echo "::error title=runpod::The new pod did not come up; the old pod keeps serving."; exit 1; }
              new_id=$(grep '^NEW ' upgrade.txt | cut -d' ' -f2)
              old_ids=$(grep '^OLD ' upgrade.txt | cut -d' ' -f2 | grep -v "^$new_id$" | paste -sd, - || true)
              RUNPOD_VLLM_URL=$(grep '^URL ' upgrade.txt | cut -d' ' -f2-)
              RUNPOD_VLLM_MODEL=""
              pod_id="$new_id"
              fingerprint
              if ! probe || ! grep -q '^TOOLS on' probe.txt; then
                npx tsx scripts/runpod-upgrade.ts --retire "$new_id"
                echo "::error title=runpod::The new pod failed the probe or its tool-call check; it was deleted and the old pod keeps serving."
                exit 1
              fi
              gpu_connect
              [ -z "$old_ids" ] || npx tsx scripts/runpod-upgrade.ts --retire "$old_ids"
              echo "::notice title=runpod::Brain's GPU now serves recipe $recipe on pod $new_id ($(grep '^POD ' upgrade.txt | cut -d' ' -f4)/h); retired: ${old_ids:-none}."
              ;;
            runpod-bench)
              # Candidate models on Brain's own tasks, each on a temporary pod deleted after (§108).
              [ -n "${RUNPOD_API_KEY:-}" ] || { echo "::error::Set the RUNPOD_API_KEY repository secret."; exit 1; }
              recipes=$(printf '%s' "$RECIPES_INPUT" | tr -cd 'a-z0-9.,-' | sed 's/baseline//; s/,,*/,/g; s/^,//; s/,$//')
              base=""; case "$RECIPES_INPUT" in *baseline*) base="--baseline" ;; esac
              timeout --signal=TERM --kill-after=60 6600 \
                npx tsx scripts/runpod-bench.ts --recipes "$recipes" --switchboard "https://$cheap.fly.dev/v1" $base | tee bench.txt
              grep -q '^RUNPOD-BENCH: OK' bench.txt || { echo "::error title=runpod::The benchmark did not finish."; exit 1; }
              grep '^WINNER' bench.txt | sed 's/^/::notice title=runpod bench::/'
              ;;
            runpod-restore)
              [ -n "${RUNPOD_API_KEY:-}" ] && [ -n "$RUNPOD_VLLM_KEY" ] || { echo "::error::Set the RUNPOD_API_KEY and RUNPOD_VLLM_KEY repository secrets."; exit 1; }
              restore --wait
              probe || { echo "::error::The GPU did not pass the probe; nothing on the Brain changed."; exit 1; }
              gpu_connect
              ;;
            runpod-cycle)
              # The production test of automatic power: stop the pod, watch the running
              # Brain start it again for waiting research, wait for vLLM. Always leaves it started.
              timeout --signal=TERM --kill-after=30 3000 \
                flyctl ssh console --app "$brain" -C "sh /app/scripts/runpod-cycle.sh" | tee cycle.txt || true
              grep -q '^RUNPOD-CYCLE: PASS' cycle.txt || { echo "::error title=runpod::The automatic stop/start test did not pass; the lines above say which step."; exit 1; }
              echo "::notice title=runpod::Automatic power proven: stopped, started by Brain for waiting research, model served."
              ;;
            prune)
              gateway_prune
              ;;
            runpod-auto)
              gateway_prune
              if [ -z "$RUNPOD_VLLM_URL" ]; then
                echo "::notice title=runpod::Waiting for the RUNPOD_VLLM_URL and RUNPOD_VLLM_KEY secrets. Free providers only."
                exit 0
              fi
              restore --wait || true
              # What the Brain runs now: its mode and the fingerprint of the settings it was given (never a key).
              state=$(flyctl ssh console --app "$brain" -C 'printenv BRAIN_RUNPOD_MODE BRAIN_RUNPOD_FINGERPRINT' 2>/dev/null | tr -d '\r' | tr '\n' ' ' || true)
              if echo "$state" | grep -qw primary && echo "$state" | grep -qw "$gpu_fp"; then
                # A pod Brain stopped for idleness fails the probe by design; the report
                # still runs, so stopped time and the money it saved are measured too.
                if probe; then :
                else echo "::notice title=runpod::The GPU did not answer its probe (stopped while idle, or down); the Brain answers on the free providers meanwhile and starts the pod when research arrives."; fi
                gpu_report
              elif echo "$state" | grep -qw off; then
                echo "::notice title=runpod::The GPU was disconnected on purpose (mode off); run runpod-connect to bring it back."
              else
                if probe; then gpu_connect
                else echo "::warning title=runpod::The GPU is not ready yet; nothing on the Brain changed. The next hourly run tries again."; fi
              fi
              ;;
            deploy)
              [ -n "$FLY_ORG_TOKEN" ] || { echo "::error::Set the FLY_ORG_TOKEN repository secret: an organization token from the Fly dashboard (Tokens). The Brain's own deploy token cannot create another app."; exit 1; }
              # The Brain's own organization, read with the Brain's token, so the
              # new app lands beside it rather than in a personal organization.
              org=$(flyctl status --app "$brain" --json | python3 -c 'import json,sys; d=json.load(sys.stdin); o=d.get("Organization") or d.get("organization") or {}; print(o.get("Slug") or o.get("slug") or "")')
              echo "organization: ${org:-unknown}"
              export FLY_API_TOKEN="$FLY_ORG_TOKEN"
              orgflag=${org:+--org $org}
              # Not `flyctl deploy`: exactly one workflow ships the Brain
              # (deploymentOwnership), and this is a different app. It runs one
              # machine from OmniRoute's published image, created once and
              # updated in place after.
              [ -n "$OMNIROUTE_PASSWORD" ] || { echo "::error::Set the OMNIROUTE_PASSWORD repository secret first."; exit 1; }
              image=diegosouzapw/omniroute:latest
              flyctl apps list $orgflag --json | grep -q "\"$cheap\"" || flyctl apps create "$cheap" $orgflag
              flyctl volumes list --app "$cheap" --json | grep -q omniroute_data \
                || flyctl volumes create omniroute_data --app "$cheap" --region iad --size 1 --yes
              flyctl ips list --app "$cheap" --json | grep -q '"v6"' || flyctl ips allocate-v6 --app "$cheap"
              flyctl ips list --app "$cheap" --json | grep -q 'shared_v4\|"v4"' || flyctl ips allocate-v4 --shared --app "$cheap" --yes
              machine=$(flyctl machine list --app "$cheap" --json | grep -o '"id": *"[0-9a-f]*"' | head -1 | grep -o '[0-9a-f]\{8,\}' || true)
              if [ -n "$machine" ]; then
                flyctl machine update "$machine" --app "$cheap" --image "$image" \
                  --vm-size shared-cpu-2x --vm-memory 2048 \
                  --env INITIAL_PASSWORD="$OMNIROUTE_PASSWORD" --yes
              else
                flyctl machine run "$image" --app "$cheap" --region iad --name omniroute \
                  --vm-size shared-cpu-2x --vm-memory 2048 \
                  --volume omniroute_data:/app/data \
                  --env PORT=20128 --env HOSTNAME=0.0.0.0 --env INITIAL_PASSWORD="$OMNIROUTE_PASSWORD" \
                  --port 443:20128/tcp:tls:http --port 80:20128/tcp:http \
                  --restart always
              fi
              echo "::notice title=cheap lane::OmniRoute is at https://$cheap.fly.dev — sign in with OMNIROUTE_PASSWORD, add providers, make a combo and an endpoint key."
              ;;
            status)
              [ -n "$FLY_ORG_TOKEN" ] || { echo "::error::Set FLY_ORG_TOKEN."; exit 1; }
              export FLY_API_TOKEN="$FLY_ORG_TOKEN"
              flyctl machine list --app "$cheap" || true
              flyctl logs --app "$cheap" --no-tail 2>&1 | tail -120 || true
              m=$(flyctl machine list --app "$cheap" --json | grep -o '"id": *"[0-9a-f]*"' | head -1 | grep -o '[0-9a-f]\{8,\}' || true)
              [ -n "$m" ] && flyctl ssh console --app "$cheap" -C "node -e \"eval(Buffer.from('','base64').toString())\"" || true
              flyctl machine status "$m" --app "$cheap" || true
              # What fills the volume: a full disk fails every call with
              # "database or disk is full" (production, 2026-11-09).
              [ -n "$m" ] && flyctl ssh console --app "$cheap" -C "sh -c 'df -h /app/data; du -ah /app/data 2>/dev/null | sort -h | tail -25'" || true
              ;;
            test)
              # One real question to each combo, timed, from outside the machine.
              [ -n "$OMNIROUTE_API_KEY" ] || { echo "::error::Set OMNIROUTE_API_KEY."; exit 1; }
              for model in $(echo "${OMNIROUTE_MODEL:-auto}" | tr ',' ' '); do
                start=$(date +%s)
                code=$(curl -sS -o reply.json -w '%{http_code}' --max-time 120 \
                  -H "authorization: Bearer $OMNIROUTE_API_KEY" -H 'content-type: application/json' \
                  -d "{\"model\":\"$model\",\"max_tokens\":2000,\"reasoning_effort\":\"low\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the word ok.\"}]}" \
                  "https://$cheap.fly.dev/v1/chat/completions") || code=000
                echo "model $model: HTTP $code in $(( $(date +%s) - start ))s"
                head -c 600 reply.json 2>/dev/null; echo
              done
              ;;
            connect)
              [ -n "$OMNIROUTE_API_KEY" ] || { echo "::error::Set the OMNIROUTE_API_KEY repository secret (an endpoint key from the OmniRoute dashboard)."; exit 1; }
              model="${OMNIROUTE_MODEL:-auto}"
              flyctl secrets set --app "$brain" \
                BRAIN_CHEAP_LLM_URL="https://$cheap.fly.dev/v1" \
                BRAIN_CHEAP_LLM_KEY="$OMNIROUTE_API_KEY" \
                BRAIN_CHEAP_LLM_MODELS="$model" >/dev/null
              echo "::notice title=cheap lane::The Brain now sends grunt work to the cheap lane (models: $model)."
              ;;
            disconnect)
              flyctl secrets unset --app "$brain" BRAIN_CHEAP_LLM_URL BRAIN_CHEAP_LLM_KEY BRAIN_CHEAP_LLM_MODELS >/dev/null
              echo "::notice title=cheap lane::The cheap lane is off."
              ;;
            claude-discovery-off)
              flyctl secrets set --app "$brain" BRAIN_CLAUDE_DISCOVERY=off >/dev/null
              echo "::notice title=discovery::Claude Routines no longer open broad discovery rounds."
              ;;
            claude-discovery-on)
              flyctl secrets unset --app "$brain" BRAIN_CLAUDE_DISCOVERY >/dev/null
              echo "::notice title=discovery::Claude Routines open broad discovery rounds again."
              ;;
            focus)
              flyctl secrets set --app "$brain" BRAIN_CLAUDE_DISCOVERY=off BRAIN_CASH_RESEARCH_MAX=1 >/dev/null
              echo "::notice title=focus::Routines: no broad discovery, one cash deep dive at a time."
              ;;
            unfocus)
              flyctl secrets unset --app "$brain" BRAIN_CLAUDE_DISCOVERY BRAIN_CASH_RESEARCH_MAX >/dev/null
              echo "::notice title=focus::Routines back to normal cash research."
              ;;
            *) echo "::error::Unknown action '$ACTION'."; exit 1 ;;
          esac

      # Readable through the checks API where the log is not; see closeout-report.yml.
      - name: Publish the output as annotations
        if: always()
        run: |
          [ -f cheap.txt ] || exit 0
          python3 - <<'PY'
          text = open('cheap.txt', encoding='utf-8', errors='replace').read()
          enc = lambda s: s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)]
          chunks = chunks if len(chunks) <= 10 else chunks[:5] + chunks[-5:]
          for n, chunk in enumerate(chunks, 1):
              print(f'::notice title=output {n}/{len(chunks)}::{enc(chunk)}')
          PY
