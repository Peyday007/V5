# Which deployment secrets exist, by name. Never a value.
#
# `fleet show` can say that a *registered* Routine expects a secret that is not
# present. It cannot say the opposite — that a secret is sitting in the
# deployment for a Routine nobody has registered — because it only ever looks up
# the names rows already name. Activating a fleet is exactly the moment that
# question matters: a surface whose credential is already deployed is one
# registration away from working, and a surface whose credential is absent needs
# a person.
#
# `flyctl secrets list` prints the name, a digest and a timestamp, and no value.
# There is nothing here that could reveal one: the command has no flag that
# prints a secret, and the step runs it with no arguments at all.
name: Fleet secrets inventory

on:
  workflow_dispatch:

concurrency:
  group: deploy-brain
  cancel-in-progress: false

jobs:
  inventory:
    name: Deployment secret names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: List
        timeout-minutes: 5
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          flyctl secrets list --app "$app"
