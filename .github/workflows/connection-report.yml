# The connection system's truth, read from production: pools, infrastructure
# incidents, real auth refusals, misses by cause, and every logical connector
# with whether a person must act. Read-only: it runs scripts/connection-report.sh
# inside the released container and changes nothing.
name: Connection report

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'How many hours back to read (1-168).'
        required: false
        default: '24'
      history:
        description: 'Print the history rows (one per dispatch event, probe, incident and token refusal) instead of the summary.'
        type: boolean
        required: false
        default: false

concurrency:
  group: brain-console-connection-report
  cancel-in-progress: false

jobs:
  report:
    name: Read the connection system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - uses: ./.github/actions/await-release
      - name: Report
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HOURS: ${{ inputs.hours }}
          HISTORY: ${{ inputs.history }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          case "$HOURS" in
            ''|*[!0-9]*) HOURS=24 ;;
          esac
          mode=""
          if [ "$HISTORY" = "true" ]; then mode="--history"; fi
          set +e
          flyctl ssh console --app "$app" \
            -C "env BRAIN_DATABASE_POOL_SIZE=1 sh /app/scripts/connection-report.sh --hours $HOURS $mode" \
            2>&1 | tee connection-report.txt
          set -e
          grep -q '^CONNECTION-REPORT: OK' connection-report.txt

      # Logs live on storage some sessions cannot reach; annotations come
      # through the GitHub API itself.
      - name: Publish the output as annotations
        if: always()
        run: |
          [ -f connection-report.txt ] || exit 0
          python3 - <<'PY'
          text = open('connection-report.txt', encoding='utf-8', errors='replace').read()
          enc = lambda s: s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          chunks = [text[i:i + 6000] for i in range(0, len(text), 6000)][:10]
          for n, chunk in enumerate(chunks, 1):
              print(f'::notice title=connection-report {n}/{len(chunks)}::{enc(chunk)}')
          PY
