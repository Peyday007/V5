# The Postgres half of the test contract, in CI.
#
# ---------------------------------------------------------------------------
# Why this exists
# ---------------------------------------------------------------------------
#
# CLAUDE.md says the Postgres run "is the only thing that proves one repository
# layer over two databases is true rather than merely compiling", and `Deploy`'s
# own verify job says, accurately, that it does not run it: "The Postgres run
# needs a server and is a local/pre-merge concern". That left the stronger of the
# two gates reachable only from whichever machine happened to have a cluster on
# it, which is the same as saying it was reachable on trust.
#
# So it runs here, on demand, against the commit you name. `workflow_dispatch`
# only, for the reason `Deploy` gives: this suite takes the best part of twenty
# minutes and a push is not a request to spend that.
#
# ---------------------------------------------------------------------------
# Why there is no password anywhere in this file
# ---------------------------------------------------------------------------
#
# The obvious shape is a `services: postgres` container with POSTGRES_PASSWORD
# written in, and the obvious shape puts a credential — a throwaway one, but a
# credential — into a file that outlives every run of it. Invariant 22 admits no
# exception for a credential that is convenient, and there is a better option on
# this runner: PostgreSQL is already installed, and Debian's default `pg_hba`
# authenticates local socket connections by *peer*, which is to say by the
# operating-system user. So the job creates a role named after the user it is
# already running as and connects over the socket. Nothing is stored, nothing is
# echoed, and there is no value for a later reader of this file to find.
name: Postgres suite

# ---------------------------------------------------------------------------
# Why a tag as well as a button
# ---------------------------------------------------------------------------
#
# `workflow_dispatch` can only be *called* for a workflow that already exists on
# the default branch — the API answers 404 for one that lives on a feature branch,
# however correct the file is. That makes the button useless for exactly the case
# it is most needed in: verifying the branch that introduces the workflow.
#
# A push trigger runs the workflow from the pushed tree itself, so the branch that
# adds this file is gated by it immediately. It is scoped to the branch that needs
# it rather than to everything, because this suite takes the best part of twenty
# minutes and most branches already have a cheaper answer. Once this reaches the
# default branch the button works everywhere and the branch list below is the part
# to delete.
#
# (A tag trigger would be tidier and is not available here: the environment this
# was written in can push a branch and is refused a tag.)
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What is being verified, for the run log'
        required: false
        default: 'the repository layer against the other backend'
  push:
    branches:
      # The canonical branch and nothing else: the full Postgres suite is the
      # cross-system gate for the SHA that is integrated and released, and it is
      # paid once, there. A feature branch runs `npm run test:impacted` (with
      # BRAIN_TEST_DATABASE_URL for this backend) on its intermediate commits,
      # and a branch that adds itself here makes every push to it pay the whole
      # suite for an answer the push to production will give again.
      # `tests/testingWorkflow.test.ts` refuses a second entry.
      - 'production'

# One at a time per ref. On a development ref the newest commit is the one worth
# the time, so an older run is cancelled. On the canonical branch it is not
# (FAC-7): every commit there may be the one Deploy releases, and cancelling
# made 92 of 200 runs end without a verdict while 4fcb143, b2e2589, 8cc6fab and
# 4bff1c2 were released with no completed Postgres run. A running canonical run
# finishes; GitHub still keeps only the newest *pending* one, which is the tip,
# and Deploy's postgres-evidence job waits for completed evidence on the exact
# commit it releases. The branch name is spelled out because an expression
# cannot read `.github/CANONICAL_BRANCH`; `tests/releaseMachinery.test.ts`
# holds the two equal.
concurrency:
  group: postgres-suite-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

jobs:
  # ---------------------------------------------------------------------------
  # Four shards, one verdict
  # ---------------------------------------------------------------------------
  #
  # Run 580 spent 71m09s in one `npm test` against one cluster, and every
  # release waited on it. The suite is split by vitest's own `--shard` across
  # four jobs, each on its own runner with its own cluster, so no shard shares
  # a database, a lock table or a schema with another.
  #
  # Nothing about what counts moved. Deploy's postgres-evidence.sh reads the
  # *run's* conclusion on the exact commit, and a run concludes success only
  # when every job in it does; `verdict` below makes that explicit and is the
  # one job a reader has to look at. A shard that fails, is cancelled or never
  # ran makes the run fail, and the commit is not deployed.
  partition:
    name: Typecheck, and list the whole suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # What the shards are checked against in `verdict`: the whole suite, as
      # vitest itself lists it from this tree and this config.
      - name: List the whole suite
        run: .github/workflows/postgres-shards.sh all postgres-suite-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: postgres-suite-files
          path: postgres-suite-files.txt
          if-no-files-found: error

  suite:
    name: The whole suite, against Postgres (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to its end, so one red run names every failure in the
      # suite rather than the first shard's. The verdict is the same either way.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The whole suite once needed 120 (it outgrew sixty on 2026-10-06); a
    # quarter of it gets the same ceiling, as a bound on a hung shard.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The same two binaries the runtime image and the Deploy gate install, for
      # the same reason: a suite that skips its OCR tests is honest and is not a
      # run of the program being shipped.
      - name: Install the OCR tooling the runtime image has
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -1

      - name: Start the cluster already on this runner, and make a database for it
        run: |
          set -euo pipefail
          # The image ships a cluster that is installed and stopped.
          sudo systemctl start postgresql || sudo pg_ctlcluster "$(pg_lsclusters -h | awk 'NR==1{print $1}')" main start
          for attempt in $(seq 1 30); do
            pg_isready -q && break
            sleep 1
          done
          pg_isready
          # Peer authentication over the socket: the role is named after the user
          # this job already runs as, so the operating system is the credential
          # and there is nothing to store. CREATEDB rather than SUPERUSER — the
          # suite creates and drops its own schemas and needs no more than that.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c \
            "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '$(whoami)') THEN CREATE ROLE \"$(whoami)\" LOGIN CREATEDB; END IF; END \$\$;"
          # `createdb` rather than a `\gexec` one-liner: `\gexec` is a psql
          # meta-command read from stdin and is a syntax error inside `-c`, which
          # is how the first run of this workflow failed.
          if ! sudo -u postgres psql -tAc \
            "SELECT 1 FROM pg_database WHERE datname = 'brain_test'" | grep -q 1; then
            sudo -u postgres createdb -O "$(whoami)" brain_test
          fi
          # ---------------------------------------------------------------
          # The lock table, sized from what the suite actually does
          # ---------------------------------------------------------------
          #
          # `openTestDatabase` gives every test file its own schema and drops it
          # with `DROP SCHEMA … CASCADE`, which takes **one lock per object** in
          # a single transaction — every table, index and sequence, plus each
          # table's toast relation and toast index. Measured on this chain: 851
          # relations in `pg_class`, and 166 of those are tables, so a single
          # drop reaches for well over a thousand locks.
          #
          # The shared lock table is `max_locks_per_transaction ×
          # (max_connections + max_prepared_transactions)` entries for the whole
          # cluster — 64 × 100 = 6400 at the stock settings this runner ships.
          # `pool: 'forks'` runs several files at once and each live file also
          # holds locks on the schema it is working in, so a handful of
          # concurrent drops exhausts it and Postgres answers `53200 out of
          # shared memory` with this exact setting named in its hint.
          #
          # **Measured rather than reasoned, because the attribution mattered.**
          # One drop was run inside an open transaction and its `pg_locks` rows
          # counted, per chain: `production` takes **1213** relation locks,
          # the branch that found this takes **1264**. At 6400 slots that is
          # `floor(6400/1213) = 5` concurrent drops and `floor(6400/1264) = 5` —
          # **the same integer**. So this is not one workstream's tables tipping
          # a threshold; the cluster was already at the edge and the branch that
          # hit it was simply the one that ran.
          #
          # It is not a per-transaction ceiling, so raising it does not let one
          # transaction misbehave; it sizes the shared table. 1024 leaves room
          # for the chain to keep growing, which it does every time a workstream
          # adds a migration — the reason this arrived as a mystery rather than
          # a warning is that the margin shrinks silently until one more table
          # crosses it.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c \
            "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          sudo systemctl restart postgresql || sudo pg_ctlcluster "$(pg_lsclusters -h | awk 'NR==1{print $1}')" main restart
          for attempt in $(seq 1 30); do
            pg_isready -q && break
            sleep 1
          done
          pg_isready
          # Proof it answers as this user, before twenty minutes are spent finding out.
          psql "postgresql:///brain_test?host=/var/run/postgresql&sslmode=disable" -tAc \
            "select 'connected as ' || current_user || ' to ' || current_database()"
          # And proof the setting took, because a restart that silently did not
          # reload it would send the next reader back to the same mystery.
          psql "postgresql:///brain_test?host=/var/run/postgresql&sslmode=disable" -tAc \
            "select 'lock table: ' || current_setting('max_locks_per_transaction') || ' × (' ||
                    current_setting('max_connections') || ' + ' ||
                    current_setting('max_prepared_transactions') || ')'"

      - run: npm ci

      # `sslmode=disable` is required rather than tidy: a unix socket cannot do
      # TLS, and the Postgres adapter asks for it by default whenever the URL
      # does not say otherwise.
      - name: The suite
        env:
          BRAIN_TEST_DATABASE_URL: postgresql:///brain_test?host=/var/run/postgresql&sslmode=disable
        run: >-
          npx vitest run --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json --reporter=github-actions
          --outputFile.json=postgres-shard-report.json

      # What this shard actually ran, read from its own report, for `verdict`
      # to hold against the whole suite. Uploaded whatever the suite said, so a
      # red shard still accounts for its files; a shard that never finished
      # writes no report and the verdict refuses it.
      - name: What this shard ran
        if: always()
        run: .github/workflows/postgres-shards.sh ran postgres-shard-report.json postgres-shard-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-shard-${{ matrix.shard }}
          path: postgres-shard-${{ matrix.shard }}.txt
          if-no-files-found: ignore

      # Useful on a failure, and quiet about the ordinary case.
      #
      # The suite drops the schemas it created when it finishes, so on a green run
      # `schema_migrations` is *correctly* gone — and asking for it anyway printed
      # `ERROR: relation "schema_migrations" does not exist` into an otherwise
      # passing log. A green log with an error in it costs somebody ten minutes
      # the next time they read one.
      - name: What the database ended up holding
        if: always()
        run: |
          present=$(psql "postgresql:///brain_test?host=/var/run/postgresql&sslmode=disable" -tAc \
            "select to_regclass('public.schema_migrations') is not null" 2>/dev/null || echo f)
          if [ "$present" = "t" ]; then
            psql "postgresql:///brain_test?host=/var/run/postgresql&sslmode=disable" -tAc \
              "select 'schema version ' || coalesce(max(version)::text, 'none') from schema_migrations"
          else
            echo "No schema left, which is what a finished run should leave: the suite drops what it created."
          fi

  # The one verdict. `if: always()` so it runs — and fails — when a shard
  # failed, was cancelled or was skipped, rather than being skipped itself.
  verdict:
    name: The Postgres suite passed on this commit
    needs: [partition, suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every shard succeeded
        env:
          PARTITION: ${{ needs.partition.result }}
          SUITE: ${{ needs.suite.result }}
        run: |
          echo "typecheck and listing: $PARTITION"
          echo "shards:                $SUITE"
          if [ "$PARTITION" != success ] || [ "$SUITE" != success ]; then
            echo "::error::Not every job passed (listing $PARTITION, shards $SUITE). This commit has no Postgres evidence."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - uses: actions/download-artifact@v4
        with:
          path: lists
      # The shard count is the matrix's above; tests/testingWorkflow.test.ts
      # holds the two equal.
      - name: Every test file ran in exactly one shard
        run: |
          .github/workflows/postgres-shards.sh check lists/postgres-suite-files/postgres-suite-files.txt \
            lists/postgres-shard-1/postgres-shard-1.txt lists/postgres-shard-2/postgres-shard-2.txt \
            lists/postgres-shard-3/postgres-shard-3.txt lists/postgres-shard-4/postgres-shard-4.txt
          echo "POSTGRES-SUITE: PASS ${{ github.sha }}"
