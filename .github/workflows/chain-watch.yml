# Where the acceptance chain has got to. Change nothing.
#
# The acceptance reporter runs *inside* the deployed machine, so its verdicts
# only move when a deployment does. This runs from the checkout against the
# cloud database, which makes it the way to watch a live run between
# deployments — and to find the anchor conversation without anybody reading an
# id off a screen and retyping it.
#
# Read-only by construction: `scripts/chain-watch.ts` issues SELECTs and
# nothing else, and it reports structure rather than content. No message body,
# no candidate statement, no probe page and no credential reaches this log; a
# stored reason is reported as its length, because "a reason is stored" is a
# structural fact and the words are the person's.
name: Chain watch

on:
  workflow_dispatch:
    inputs:
      conversation:
        description: 'A conversation id to anchor on. Empty lists the five most recent.'
        required: false
        default: ''

# Not in the deploy group: this reads the database rather than the machine, so
# it is safe beside a deployment and useful during one.
concurrency:
  group: chain-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Read the chain
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Inside the machine, like every other production read here.
      #
      # The first version of this ran from the checkout against
      # `BRAIN_DATABASE_URL`, on the assumption that it was a repository secret
      # because `step12a-inspect.yml` guards on one. It is not — it is a Fly
      # secret, and that guard has always been skipping. The database is
      # reachable from the machine and from nowhere else, which is the correct
      # arrangement and is why this asks the machine.
      #
      # `sh scripts/chain-watch.sh` rather than a `node` one-liner: `ssh
      # console -C` opens in `/`, and `node --import tsx` resolves tsx relative
      # to the working directory. Same reason `step10.sh` exists.
      - name: The chain
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Through the environment, never interpolated into a shell command:
          # an input pasted into a command line is an injection whatever the
          # dispatcher intended.
          CHAIN_CONVERSATION: ${{ inputs.conversation }}
        run: |
          case "$CHAIN_CONVERSATION" in
            ''|rcv_[0-9a-f]*) ;;
            *) echo "::error::A conversation id is rcv_ followed by hex."; exit 1 ;;
          esac
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/chain-watch.sh $CHAIN_CONVERSATION"
