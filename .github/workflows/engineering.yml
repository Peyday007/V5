name: Engineering report

# The production door for `npm run engineering -- report`: the interventions
# the policy recorded, the metrics they add up to, and which workers actually
# called the connector (read from the MCP audit). Read-only.
on:
  workflow_dispatch:

concurrency:
  group: brain-console-engineering
  cancel-in-progress: false

jobs:
  report:
    name: Read the engineering connector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - uses: ./.github/actions/await-release

      - name: Report
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" -C "sh /app/scripts/engineering.sh report" 2>&1 | tee engineering.txt
          set -e
          grep -q '^ENGINEERING: OK' engineering.txt
