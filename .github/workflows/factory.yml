# Operating the Software Factory in the deployed Brain, without a terminal.
#
# ---------------------------------------------------------------------------
# What this is and is not
# ---------------------------------------------------------------------------
#
# It is the same mechanism `fleet.yml` and `step10.yml` use, for the same
# reason: submitting an objective, approving it and reading a campaign's stage
# are things done repeatedly against the machine that holds the rows, and doing
# them through the deploy pipeline would cost a build and a restart every time.
#
# It is **not** the normal route. The normal route is `/build` in the Russell
# shell, where a person says what should become true, picks one of the
# authorized repositories and approves. This exists for the case that surface is
# for the operator rather than the product: repairing access, reading a stage
# when the client bundle will not load, and running a campaign that was
# authorized in writing somewhere other than a browser.
#
# It is also not `/operator`, which stays deleted. Nothing here renders a page.
#
# ---------------------------------------------------------------------------
# Why an objective arrives as a committed file
# ---------------------------------------------------------------------------
#
# An objective is prose — several paragraphs and a list of acceptance
# conditions — and prose in a workflow input is prose that has to survive a
# dispatcher, a shell and an SSH session. The same text in a committed file is
# reviewable in a diff and cannot be mangled on the way. So `--file` names a path
# in the repository and nothing long is ever interpolated.
#
# It lives in `objectives/` at the root and not under `docs/`, which
# `.dockerignore` excludes — a container image is copied and pulled by machines
# nobody here controls, so the documentation stays out of it. The first objective
# was written under `docs/` and the deployed Brain answered ENOENT: a path that
# exists only in the repository is a path the container cannot open.
name: Factory

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'submit | approve | status | events | throughput | pull-request | campaigns | bins | remote-tick | amend | plan | release | set-state | answer-bin | reauthorize | regrant-unit | retire'
        required: true
        default: status
      file:
        description: '--file (a path in the image, e.g. objectives/x.json, for submit)'
        required: false
        default: ''
      change_request:
        description: '--change-request (an fcr_… id)'
        required: false
        default: ''
      campaign:
        description: '--campaign (an fcp_… id)'
        required: false
        default: ''
      admin:
        description: '--admin <email>: the administrator a decision is recorded against.'
        required: false
        default: ''
      extra:
        description: 'Any further --flag value pairs, e.g. "--project prj_x --base main"'
        required: false
        default: ''

# Never at the same time as a deploy: the machine is being replaced during one.
concurrency:
  group: brain-console-factory
  cancel-in-progress: false

jobs:
  factory:
    name: Factory operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Wait for a release, rather than racing one.
      #
      # This workflow used to share `deploy-brain` with the deploy and with
      # every other operator command, which kept it off a machine mid-release
      # and *also* let it silently cancel a queued deploy — GitHub keeps one
      # pending run per group and the newest evicts the one that was waiting.
      # The group is this workflow's own now, so nothing here can evict
      # anything; this step is the half of the old group that was worth
      # keeping. See `.github/actions/await-release/action.yml`.
      - uses: ./.github/actions/await-release

      - name: Run
        timeout-minutes: 20
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Through the environment, never interpolated into the shell: an input
          # pasted into a command line is an injection whatever the dispatcher
          # intended, and "only I can run this workflow" is not a guard.
          FACTORY_COMMAND: ${{ inputs.command }}
          FACTORY_FILE: ${{ inputs.file }}
          FACTORY_CR: ${{ inputs.change_request }}
          FACTORY_ADMIN: ${{ inputs.admin }}
          FACTORY_CAMPAIGN: ${{ inputs.campaign }}
          FACTORY_EXTRA: ${{ inputs.extra }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)

          # Letters, digits, dot, colon, dash, underscore and — for the file
          # path only — a forward slash. Everything a shell could act on is
          # refused rather than escaped.
          for value in "$FACTORY_COMMAND" "$FACTORY_CR" "$FACTORY_CAMPAIGN"; do
            case "$value" in
              ''|*[!A-Za-z0-9_.:-]*)
                if [ -n "$value" ]; then
                  echo "::error::Refusing '$value': letters, digits, dot, colon, dash, underscore."
                  exit 1
                fi
                ;;
            esac
          done
          case "$FACTORY_FILE" in
            '') ;;
            *[!A-Za-z0-9_./-]*)
              echo "::error::Refusing the file path: letters, digits, dot, slash, dash, underscore."
              exit 1
              ;;
          esac
          # An address additionally needs @ and +, which is why it is its own
          # input rather than something to paste into `extra`. `admin.yml`,
          # `packets.yml` and `routing.yml` each draw the same line for the same
          # reason: widening the general class to fit an address would widen it
          # for every other flag too.
          case "$FACTORY_ADMIN" in
            '') ;;
            *[!A-Za-z0-9_.@+-]*)
              echo "::error::Refusing the administrator address: that is not an address."
              exit 1
              ;;
          esac
          case "$FACTORY_EXTRA" in
            *[!A-Za-z0-9_.:/,\ -]*)
              echo "::error::Refusing the extra flags: the same class, plus spaces, slashes and commas."
              exit 1
              ;;
          esac

          args="$FACTORY_COMMAND"
          if [ -n "$FACTORY_FILE" ];     then args="$args --file $FACTORY_FILE"; fi
          if [ -n "$FACTORY_CR" ];       then args="$args --change-request $FACTORY_CR"; fi
          if [ -n "$FACTORY_CAMPAIGN" ]; then args="$args --campaign $FACTORY_CAMPAIGN"; fi
          if [ -n "$FACTORY_ADMIN" ];    then args="$args --admin $FACTORY_ADMIN"; fi
          if [ -n "$FACTORY_EXTRA" ];    then args="$args $FACTORY_EXTRA"; fi

          echo "factory $args"
          set +e
          flyctl ssh console --app "$app" -C "env BRAIN_DATABASE_POOL_SIZE=1 sh /app/scripts/factory.sh $args" 2>&1 | tee factory.txt
          set -e

          # The verdict comes from a line the script printed, not from an exit
          # code that had to survive an SSH session, a shell and a CLI — the
          # same reasoning `deploy.yml` states beside its hosted verification
          # and `step10.yml` applies with `STEP10: OK`.
          #
          # This step used to end at the `tee` above, and a pipeline's status is
          # the last stage's, so every run was green whatever happened. Measured
          # against the deployed image: `factory pull-request` on a build with
          # no such command printed the usage list and the run succeeded. A
          # failure rendered as a pass is worse than one that is merely loud.
          if grep -q '^FACTORY: OK' factory.txt; then
            exit 0
          fi
          if grep -q '^FACTORY REFUSED' factory.txt; then
            echo "::error::The factory refused this command. The refusal is above."
            exit 1
          fi
          if [ ! -s factory.txt ]; then
            echo "::error::Nothing came back. If the output above says the SSH connection failed, the Fly token cannot open a console on this app."
            exit 1
          fi
          echo "::error::The command did not complete. Its output is above; an unknown command prints the list of the ones that exist."
          exit 1
