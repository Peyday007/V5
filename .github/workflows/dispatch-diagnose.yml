# Reading the dispatcher while a deploy is running.
#
# Every production read surface in this repository — `fleet.yml`, `step10.yml`,
# `packet-report.yml`, `admin.yml`, `cash-report.yml` and the rest — waits for
# an in-flight deploy before it opens an ssh session. That is right for a
# *measurement*, because the machine is replaced during a deploy and a reading
# that raced the restart would be reporting whichever half answered. It is
# wrong for a *diagnosis*: a deploy is forty minutes of tests, build, release
# and two hosted verifications, and the moment somebody most needs to know why
# the fleet has stopped firing is precisely the moment one of those is running.
#
# (They used to *share* the deploy's concurrency group, which waited in the
# same sense and also let any one of them silently cancel a queued deploy. The
# group was split and the waiting moved into
# `.github/actions/await-release`; this file's reason for existing is
# unchanged, because it is the wait rather than the group that it opts out of.)
#
# So this is the same reads, without that wait, and it is read-only in the
# strongest available sense: every command it can run is one of five named here,
# the input is a bin id validated against a character class, and nothing it
# invokes writes a row. It cannot deploy, restart, migrate, register, fire,
# claim or cancel anything. A reading taken during a restart may fail or may
# describe the outgoing machine, and that is the cost of being able to take it
# at all — it is a diagnosis rather than an acceptance measurement, and no gate
# reads it.
name: Dispatch diagnose

on:
  workflow_dispatch:
    inputs:
      bin:
        description: 'Optional bin id (bin_…) to trace as well'
        required: false
        default: ''

# Deliberately its own group, for the reason above. `chain-watch.yml` already
# makes the same judgement for the same reason.
concurrency:
  group: dispatch-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read the dispatcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read
        timeout-minutes: 20
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          # Through the environment, never interpolated into a shell command: an
          # input pasted into a command line is an injection whatever the
          # dispatcher intended.
          DIAG_BIN: ${{ inputs.bin }}
        run: |
          case "$DIAG_BIN" in
            ''|bin_[0-9a-f]*) ;;
            *) echo "::error::A bin id is bin_ followed by hex."; exit 1 ;;
          esac
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)

          echo "=============== fleet show ==============="
          flyctl ssh console --app "$app" -C "sh /app/scripts/fleet.sh show" 2>&1 | tail -120

          echo "=============== step10 report ==============="
          flyctl ssh console --app "$app" -C "sh /app/scripts/step10.sh report" 2>&1 | tail -120

          echo "=============== step10 in-flight ==============="
          flyctl ssh console --app "$app" -C "sh /app/scripts/step10.sh in-flight" 2>&1 | tail -120

          echo "=============== step10 fire-check ==============="
          flyctl ssh console --app "$app" -C "sh /app/scripts/step10.sh fire-check" 2>&1 | tail -80

          if [ -n "$DIAG_BIN" ]; then
            echo "=============== step10 trace $DIAG_BIN ==============="
            flyctl ssh console --app "$app" -C "sh /app/scripts/step10.sh trace $DIAG_BIN" 2>&1 | tail -200
          fi
