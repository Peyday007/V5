# The Neighbor Card outreach, every hour (owner's order, 2026-11-11).
#
# One pass of scripts/neighbor-card.ts on the deployed machine, where the
# Instantly key already is (INSTANTLY_API_KEY, §94): keep the campaign's
# senders, limit and sequence as written, add West Shore businesses whose own
# website publishes an address, and print Instantly's delivery counts. The
# pass rotates its sources by the hour, so a day of passes covers every chamber
# category and map tile. It handles no secret.
name: Neighbor Card outreach

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

concurrency:
  group: brain-console-neighbor-card
  cancel-in-progress: false

jobs:
  pass:
    name: Sync, refill, report
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Never against a machine mid-release; see .github/actions/await-release.
      - uses: ./.github/actions/await-release

      - name: Pass
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" -C "sh -c 'cd /app && node --import tsx scripts/neighbor-card.ts'" 2>&1 | tee pass.txt
          set -e
          grep -q '^NEIGHBOR-CARD: OK' pass.txt

      # Readable through the checks API, where the log is not.
      - name: Publish the pass as annotations
        if: always()
        run: |
          [ -f pass.txt ] || exit 0
          python3 - <<'PY'
          text = open('pass.txt', encoding='utf-8', errors='replace').read()
          enc = lambda s: s.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          chunks = [text[i:i + 3500] for i in range(0, len(text), 3500)][-10:]
          for n, chunk in enumerate(chunks, 1):
              print(f'::notice title=pass {n}/{len(chunks)}::{enc(chunk)}')
          PY
