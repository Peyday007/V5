# Reading what Brain recommends for every recorded objective, without a
# terminal and without a person relaying it.
#
# `cash-report.yml` answers "where is the sprint"; this answers the question a
# person actually asks of it — what can we actually do, and what is the first
# step. It prints the decision brief `services/decision` composes, every path it
# compared, every rejection with the row that decided it, and each objective's
# steps and recommendation history. For a sprint whose objective nobody has
# asked about yet it composes the brief transiently and writes nothing.
#
# Read-only: no deploy, no restart, no migration, no write.
name: Decision report

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Optional project id (prj_...). Omit to report every project with an objective or a sprint.'
        required: false
        default: ''

# Never at the same time as a deploy: the machine is being replaced during one,
# and a report that raced a restart would be reporting whichever half answered.
concurrency:
  group: brain-console-decision-report
  cancel-in-progress: false

jobs:
  report:
    name: Read the decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Wait for a release, rather than racing one.
      #
      # This workflow used to share `deploy-brain` with the deploy and with
      # every other operator command, which kept it off a machine mid-release
      # and *also* let it silently cancel a queued deploy — GitHub keeps one
      # pending run per group and the newest evicts the one that was waiting.
      # The group is this workflow's own now, so nothing here can evict
      # anything; this step is the half of the old group that was worth
      # keeping. See `.github/actions/await-release/action.yml`.
      - uses: ./.github/actions/await-release

      - name: Report
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          args=""
          if [ -n "${{ inputs.project }}" ]; then
            args="--project ${{ inputs.project }}"
          fi
          set +e
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/decision-report.sh $args" \
            2>&1 | tee decision-report.txt
          set -e
          grep -q '^DECISION-REPORT: OK' decision-report.txt
