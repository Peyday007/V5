| mutation 20 - product owner, 2026-09-08: "Before the next deployment, walk the ENTIRE remaining acceptance journey through the actual production entry points... Fix the connected defects as one coherent package... Then deploy within existing authorization and execute the live acceptance journey." - four connected repairs. (a) The mission reservation spans the mission's live span instead of a function call, so maxConcurrent counts something a running mission is in; cancellation settles rather than refunds; the tick renews a live hold so expiry cannot refund by elapsed time. (b) raiseGoalCeiling: the same grant, one named ceiling, upward only, audited, surfaced on the line where the limit is spent - because withdraw-and-regrant mints a new goal id and every count is per goal id. (c) The placeholder floor moves into the completion contract, where a worker still holds its attempts, because refusing in applyPlan left the idea permanently unselectable. (d) linkFiledWork attaches the packet's filed document and audit to the mission - nothing ever set russell_missions.document_id, so the writeback and the follow-on were unreachable, and the integration test had been writing that column by hand. Plus a launch refused by a cumulative ceiling now reaches the person instead of being dropped. No migration. See docs/STEP-12A-EVIDENCE.md 56-57. | mutation 21 - product owner, 2026-09-08: "close this concrete budget discrepancy... Make the displayed consumption match enforcement, including a reservation whose amount exceeds 1." - spendOf counted reservation rows while totalsThroughMine summed amount. Both agree today only because no caller passes an amount, and reserve accepts one: the first reservation of 2 would have enforced as 2 and displayed as 1, so the card would read "1 of 2 used" while Russell refused to start anything. spendTotals is that arithmetic, exported from the repository that owns the guard and sitting beside it, minus only the rank clause that makes a race deter