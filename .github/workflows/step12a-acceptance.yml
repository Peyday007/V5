# The Step 12A acceptance verdict, read from production.
#
# `npm run step12a:acceptance` counts authoritative rows and prints the
# twenty-two gates. It is read-only by construction — it opens the configured
# database, counts, prints and closes — so this workflow creates nothing,
# advances nothing and takes no decision. It is not a delivery mutation, for the
# same reason `step12a-inspect.yml` is not: nothing about what is running
# changes.
#
# It has to run *inside* the container because that is the only place with the
# cloud database credential. `BRAIN_DATABASE_URL` is a Fly secret and
# deliberately not a GitHub one; putting it in a second system to save an SSH
# hop would be a worse trade than the hop.
#
# `npm --prefix` rather than the bare script path: `flyctl ssh console -C` opens
# a session in `/`, and `node --import tsx` resolves `tsx` relative to the
# working directory. npm runs a lifecycle script with the prefix as its working
# directory, which is exactly what is needed and takes no nested quoting.

name: Step 12A acceptance

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this reading is being taken, for the run log'
        required: false
        default: 'acceptance verdict'

concurrency:
  group: step12a-acceptance
  cancel-in-progress: false

jobs:
  report:
    name: Read the gates from production rows
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Full history: A19 compares the deployed commit's application tree to
      # the tip's, which a shallow clone cannot do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run the acceptance reporter in the container
        id: report
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "npm --prefix /app run --silent step12a:acceptance" \
            2>&1 | tee acceptance.txt
          set -e
          # The verdict comes from the reporter's own summary line rather than
          # from an exit code that had to survive an SSH session, a shell and a
          # CLI — the same reason the hosted verification prints a marker.
          if ! grep -q 'STEP 12A ACCEPTANCE' acceptance.txt; then
            echo "::error::The reporter never ran. Read the output above."
            exit 1
          fi
          grep -E 'PASS ·|A[0-9]{2}_' acceptance.txt || true
          if grep -q 'STEP 12A IS NOT COMPLETE' acceptance.txt; then
            echo "::warning::Step 12A is not complete. The unmet gates are listed above."
            exit 0
          fi
          echo "Every gate is PASS."

      # -------------------------------------------------------------------
      # A19, which is not a database fact and never will be
      # -------------------------------------------------------------------
      #
      # The reporter runs inside the container and reads rows. No row in that
      # database can say "hosted verification passed before and after a real
      # restart" — that is a fact about *deliveries*, and it lives in the
      # workflow runs that performed them. So the reporter reports `NOT_RUN`
      # for A19 truthfully and permanently, and the verdict is derived here,
      # where the evidence actually is.
      #
      # This is the one gate whose authority is the workflow rather than the
      # reporter, and saying so is the point: a gate that could never pass
      # would be a broken gate, and one the reporter faked from a row it
      # invented would be worse.
      #
      # Four conditions, all read-only, none of them assertable by this file:
      #
      #   1. the branch tip was deployed by a successful Deploy run;
      #   2. that run proved the Brain *before* the restart;
      #   3. it restarted the machine and proved it *after*;
      #   4. the delivery ledger holds exactly four spent mutations — the
      #      build contract's three, plus the fourth the product owner
      #      explicitly authorized for the adaptive audit separation
      #      correction.
      #
      # And then the live liveness check, because a green run in the past says
      # nothing about the Brain answering now.
      - name: Derive A19 from the delivery ledger
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          # The delivery ledger, by run id.
          #
          # Declared rather than counted, because "every successful Deploy run
          # on this branch" is not the ledger — the branch has a hundred of
          # them from Steps 8 through 11, and counting those reported twenty
          # mutations against a budget of three. The ledger is the runs
          # docs/STEP-12A-EVIDENCE.md §8 and §10 name, and it is a constant
          # here for the same reason the approval envelope is a constant in
          # code: nobody should be able to widen the budget their own delivery
          # is judged against.
          #
          # The fourth entry is the deployment of the adaptive audit separation
          # correction, and the fifth is the read layer, the constellation and
          # the switched-off conversation lane. Both exceed the build contract's
          # three-mutation budget and both are here **only** because the product
          # owner authorized them, in writing, before they were spent — the
          # fifth explicitly conditional on the populated-data upgrade path
          # being proved on both chains first, which it was.
          #
          # The sixth is the capacity-ledger attribution, the arrival counter,
          # the derived pending state, `turn-trace` and the A22 deferral. It was
          # requested with its reason, expected effect and recovery plan, and
          # authorized in writing before it was spent. It is **not** the
          # acceptance-scope deployment the owner approved earlier: that one is
          # still unspent, is still scope-pin-only, and will take the next
          # number it is actually given rather than one assumed in advance.
          #
          # Those authorizations are what `EXPECTED` is raised against; raising
          # it without one would be exactly the widening this constant exists to
          # prevent. The full texts are in docs/STEP-12A-EVIDENCE.md §10 and
          # §19, and the upgrade proof is §23.
          LEDGER: '33835314104 33837508678 33838743276 33845601961 33921379946 33979964910 33993596193 34001975285 34003640492 34017681333 34019241560 34027453645 34056333162 34097522616 34146782575 34158835836 34164941717 34167283685 34168301362 34193404379 34194345179 34195380321 34207562649 34213508698 34250568604 34296416087 34307388916 34310181333'
          EXPECTED: '28'
          AUTHORIZATION: >-
            mutation 4 — product owner, 2026-09-04: "I authorize exactly one additional application deployment for the adaptive audit correction." | mutation 5 — product owner, 2026-09-04, conditional on the populated-data upgrade proof passing on both chains: "I authorize this exact Step 12A activation sequence: 1. Deploy the current application tree ... with migrations 028/029. Perform the documented restart, hosted verification, canary, and rollback checks." | mutation 6 — product owner, 2026-09-05: "I authorize mutation 6: deploy f5ca139 with the documented attribution, arrival-counter, pending-state, trace, and A22-deferral fixes. Use the established deployment checks, verification before and after restart, and rollback procedure." | mutation 7 — product owner, 2026-09-05: "I authorize mutation 7: deploy 0a958eb with the priority vocabulary, capacity-deferral fix, and New conversation/thread-switching controls, using the established verification and rollback procedure." — DELIVERED AS 3e1e795, a SUPERSET of 0a958eb and disclosed as one: the same instruction required confirming, before deployment, that the capacity calculation distinguishes occupied slots from stale reservations. It did not, so that fix is in this deployment. See docs/STEP-12A-EVIDENCE.md 33. | mutation 8 — product owner, 2026-09-05: "I authorize deploying 8efefb9 with all three changes: picker clarification, the read-only in-flight command, and the REQUIRED_PART manifest fix. Use the established verification and rollback process. Before deployment, check the complete proposal contract against the manifest in one pass." — DELIVERED AS 398bfd7, a SUPERSET of 8efefb9 and disclosed as one: that one-pass contract check found five more length bounds the validator enforces and the manifest never stated, so the manifest fix for those is in this deployment. Nothing was loosened. See docs/STEP-12A-EVIDENCE.md 38. | mutation 9 — product owner, 2026-09-06: "I authorize mutation 9: deploy 5afd163 with the retryTurn service, owner-only retry route, Try again button, and step10 retry-turn command. Use the established verification and rollback process. Before deployment, confirm that concurrent retry requests cannot create duplicate active attempts or exceed the three-attempt limit, and that the operator command enforces its intended authorization boundary." — DELIVERED AS ef2e45c, a SUPERSET of 5afd163 and disclosed as one: that authorized check FAILED. Two concurrent retries both claimed attempt 2 and created two bins, so migrations 030/021 add UNIQUE (answers_message_id, attempt) and the claim became an INSERT ... ON CONFLICT DO NOTHING. See docs/STEP-12A-EVIDENCE.md 40. | mutation 10 — product owner, 2026-09-06, spending the reserved scope-pin authorization: "Proceed with mutation 10 using the existing, unspent scope-pin authorization. This is the action that approval was reserved for. Deploy cf80fa6 after confirming its application change is limited to setting ACCEPTANCE_SCOPE.conversationId to rcv_35d5b0340fc4479fa443, with the accompanying evidence documentation." — DELIVERED AS cf80fa6 exactly. One application line changed; the rest is the comment above it and evidence documentation. The scope-pin approval is now SPENT. | mutation 11 — product owner, 2026-09-06: authorized a read-only diagnostic exposing the complete structural trace for the acceptance turn. Delivered as f67021e; read-only, no behaviour change. See docs/STEP-12A-EVIDENCE.md 43-44. | mutation 12 — product owner, 2026-09-06: "I authorize mutation 12: deploy e3760c1 with the complete connected-workflow repair." — capture to judgment to bounded look to mission launch, RUSSELL_PLAN_V1 through the subscription fleet, archive-first coverage, authority folded into the judgment, and unsupported actions refused rather than reported as success. No migration. See docs/STEP-12A-EVIDENCE.md 45. | mutation 13 — product owner, 2026-09-06: "Choose B: repair the existing budget control before activation. Do not ra