# The Step 12A acceptance verdict, read from production.
#
# `npm run step12a:acceptance` counts authoritative rows and prints the
# twenty-two gates. It is read-only by construction — it opens the configured
# database, counts, prints and closes — so this workflow creates nothing,
# advances nothing and takes no decision. It is not a delivery mutation, for the
# same reason `step12a-inspect.yml` is not: nothing about what is running
# changes.
#
# It has to run *inside* the container because that is the only place with the
# cloud database credential. `BRAIN_DATABASE_URL` is a Fly secret and
# deliberately not a GitHub one; putting it in a second system to save an SSH
# hop would be a worse trade than the hop.
#
# `npm --prefix` rather than the bare script path: `flyctl ssh console -C` opens
# a session in `/`, and `node --import tsx` resolves `tsx` relative to the
# working directory. npm runs a lifecycle script with the prefix as its working
# directory, which is exactly what is needed and takes no nested quoting.

name: Step 12A acceptance

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this reading is being taken, for the run log'
        required: false
        default: 'acceptance verdict'

concurrency:
  group: step12a-acceptance
  cancel-in-progress: false

jobs:
  report:
    name: Read the gates from production rows
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Full history: A19 compares the deployed commit's application tree to
      # the tip's, which a shallow clone cannot do.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run the acceptance reporter in the container
        id: report
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "npm --prefix /app run --silent step12a:acceptance" \
            2>&1 | tee acceptance.txt
          set -e
          # The verdict comes from the reporter's own summary line rather than
          # from an exit code that had to survive an SSH session, a shell and a
          # CLI — the same reason the hosted verification prints a marker.
          if ! grep -q 'STEP 12A ACCEPTANCE' acceptance.txt; then
            echo "::error::The reporter never ran. Read the output above."
            exit 1
          fi
          grep -E 'PASS ·|A[0-9]{2}_' acceptance.txt || true
          if grep -q 'STEP 12A IS NOT COMPLETE' acceptance.txt; then
            echo "::warning::Step 12A is not complete. The unmet gates are listed above."
            exit 0
          fi
          echo "Every gate is PASS."

      # -------------------------------------------------------------------
      # A19, which is not a database fact and never will be
      # -------------------------------------------------------------------
      #
      # The reporter runs inside the container and reads rows. No row in that
      # database can say "hosted verification passed before and after a real
      # restart" — that is a fact about *deliveries*, and it lives in the
      # workflow runs that performed them. So the reporter reports `NOT_RUN`
      # for A19 truthfully and permanently, and the verdict is derived here,
      # where the evidence actually is.
      #
      # This is the one gate whose authority is the workflow rather than the
      # reporter, and saying so is the point: a gate that could never pass
      # would be a broken gate, and one the reporter faked from a row it
      # invented would be worse.
      #
      # Four conditions, all read-only, none of them assertable by this file:
      #
      #   1. the branch tip was deployed by a successful Deploy run;
      #   2. that run proved the Brain *before* the restart;
      #   3. it restarted the machine and proved it *after*;
      #   4. the delivery ledger holds exactly four spent mutations — the
      #      build contract's three, plus the fourth the product owner
      #      explicitly authorized for the adaptive audit separation
      #      correction.
      #
      # And then the live liveness check, because a green run in the past says
      # nothing about the Brain answering now.
      - name: Derive A19 from the delivery ledger
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
          # The delivery ledger, by run id.
          #
          # Declared rather than counted, because "every successful Deploy run
          # on this branch" is not the ledger — the branch has a hundred of
          # them from Steps 8 through 11, and counting those reported twenty
          # mutations against a budget of three. The ledger is the runs
          # docs/STEP-12A-EVIDENCE.md §8 and §10 name, and it is a constant
          # here for the same reason the approval envelope is a constant in
          # code: nobody should be able to widen the budget their own delivery
          # is judged against.
          #
          # The fourth entry is the deployment of the adaptive audit separation
          # correction, and the fifth is the read layer, the constellation and
          # the switched-off conversation lane. Both exceed the build contract's
          # three-mutation budget and both are here **only** because the product
          # owner authorized them, in writing, before they were spent — the
          # fifth explicitly conditional on the populated-data upgrade path
          # being proved on both chains first, which it was.
          #
          # Those authorizations are what `EXPECTED` is raised against; raising
          # it without one would be exactly the widening this constant exists to
          # prevent. The full texts are in docs/STEP-12A-EVIDENCE.md §10 and
          # §19, and the upgrade proof is §23.
          LEDGER: '33835314104 33837508678 33838743276 33845601961 33921379946'
          EXPECTED: '5'
          AUTHORIZATION: 'mutation 4 — product owner, 2026-09-04: "I authorize exactly one additional application deployment for the adaptive audit correction." | mutation 5 — product owner, 2026-09-04, conditional on the populated-data upgrade proof passing on both chains: "I authorize this exact Step 12A activation sequence: 1. Deploy the current application tree ... with migrations 028/029. Perform the documented restart, hosted verification, canary, and rollback checks."'
        run: |
          set -euo pipefail
          api() {
            curl -sS -H "authorization: Bearer $GH_TOKEN" \
                 -H 'accept: application/vnd.github+json' "$1"
          }
          base="https://api.github.com/repos/${{ github.repository }}"
          fail=0
          spent=0
          deployed=''

          for run in $LEDGER; do
            spent=$((spent + 1))
            meta=$(api "$base/actions/runs/$run")
            conclusion=$(echo "$meta" | jq -r '.conclusion // "missing"')
            sha=$(echo "$meta" | jq -r '.head_sha // ""')
            deployed="$sha"

            # Steps by name rather than the job's conclusion, so a renamed step
            # fails this loudly instead of quietly passing on a success that
            # proved less than it used to.
            jobs=$(api "$base/actions/runs/$run/jobs?per_page=50")
            before=$(echo "$jobs" | jq -r '[.jobs[].steps[]? | select(.name=="Prove the live Brain is actually shut") | .conclusion] | first // "missing"')
            restart=$(echo "$jobs" | jq -r '[.jobs[].steps[]? | select(.name=="Restart it, so persistence means something") | .conclusion] | first // "missing"')
            after=$(echo "$jobs" | jq -r '[.jobs[].steps[]? | select(.name=="Prove it survived the restart") | .conclusion] | first // "missing"')

            echo "mutation $spent  run $run  ${sha:0:7}  deploy=$conclusion  before=$before  restart=$restart  after=$after"
            [ "$conclusion" = "success" ] || fail=1
            [ "$before" = "success" ]     || fail=1
            [ "$restart" = "success" ]    || fail=1
            [ "$after" = "success" ]      || fail=1
          done

          echo "authorizations: $AUTHORIZATION"
          if [ "$spent" -ne "$EXPECTED" ]; then
            echo "::warning::the ledger names $spent mutations, expected $EXPECTED"
            fail=1
          fi

          # The deployed commit against this one — the *application* only.
          #
          # Commit equality is the wrong rule: recording what an acceptance
          # found is a documentation commit, and it must not invalidate the
          # delivery evidence it is recording. What matters is whether the
          # running program is the program being read, so the comparison is
          # over the paths that end up in the image. A change under `server/`
          # or `scripts/` fails this; a change under `docs/` or
          # `.github/workflows/` does not, because neither is in the image.
          echo "deployed commit: ${deployed:0:7}   acceptance reading: ${GITHUB_SHA:0:7}"
          if [ -n "$deployed" ] && ! git diff --quiet "$deployed" "$GITHUB_SHA" -- \
               server client scripts package.json package-lock.json Dockerfile fly.toml; then
            echo "::warning::application code changed since the last delivery — this tree is not what is running"
            git diff --stat "$deployed" "$GITHUB_SHA" -- \
              server client scripts package.json package-lock.json Dockerfile fly.toml
            fail=1
          else
            echo "the deployed application tree is identical to the one being read"
          fi

          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          live=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/healthz" || true)
          shut=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/api/projects" || true)
          echo "live /healthz: $live   anonymous /api/projects: $shut"
          [ "$live" = "200" ] || fail=1
          [ "$shut" = "401" ] || fail=1

          if [ "$fail" = "0" ]; then
            echo "A19_DELIVERY               PASS      $spent/$EXPECTED mutations, each verified before and after a real restart; the deployed application tree is the one this acceptance read" | tee -a acceptance.txt
          else
            echo "A19_DELIVERY               NOT_RUN   the delivery evidence above is incomplete" | tee -a acceptance.txt
          fi

      # The composed verdict.
      #
      # The reporter is the authority on the eighteen gates it can read from
      # rows, and this file is the authority on the one it cannot. Neither is
      # allowed to speak for the other, so both are printed and the total is
      # arithmetic rather than a judgement.
      - name: The verdict
        run: |
          set -euo pipefail
          # One verdict per gate id, last line wins.
          #
          # The captured output can carry the table more than once — an SSH
          # session replays what it streamed — and A19 legitimately appears
          # twice, once from the container and once from the step above. A
          # straight `grep -c` would report more gates than exist,
          # which is the kind of arithmetic that makes a summary worthless.
          # Taking the last verdict per id is also what makes the derived A19
          # override the reporter's, without either of them knowing about the
          # other.
          awk '/^A[0-9][0-9]_[A-Z_]+[ ]+(PASS|FAIL|BLOCKED|NOT_RUN|DEFERRED)/ { seen[$1] = $2 }
               END { for (g in seen) print g, seen[g] }' acceptance.txt | sort > gates.txt
          echo "--- twenty-two gates, one verdict each ---"
          cat gates.txt
          total=$(wc -l < gates.txt)
          pass=$(awk '$2=="PASS"' gates.txt | wc -l)
          fail=$(awk '$2=="FAIL"' gates.txt | wc -l)
          blocked=$(awk '$2=="BLOCKED"' gates.txt | wc -l)
          notrun=$(awk '$2=="NOT_RUN"' gates.txt | wc -l)
          deferred=$(awk '$2=="DEFERRED"' gates.txt | wc -l)
          # A20-A22 were added for the usability contract; the historical
          # nineteen keep their ids and their meaning, so an older archived
          # reading still reads correctly against its own run.
          #
          # The gate *count* stays 22 whatever any of them says. A deferral
          # leaves the denominator, never the table — a requirement that
          # vanished from the list would be indistinguishable from one nobody
          # wrote, which is exactly what the owner asked not to happen.
          if [ "$total" -ne 22 ]; then
            echo "::error::read $total gates, expected 22 — the reporter's output was not fully captured"
            exit 1
          fi
          inscope=$((total - deferred))
          echo "STEP 12A — composed: $pass/$inscope PASS · $fail FAIL · $blocked BLOCKED · $notrun NOT_RUN · $deferred DEFERRED (of $total gates)"
          if [ "$deferred" -gt 0 ]; then
            echo "Deferred by the owner and excluded from the denominator:"
            awk '$2=="DEFERRED" { print "  " $1 }' gates.txt
          fi
          if [ "$fail" -gt 0 ] || [ "$blocked" -gt 0 ] || [ "$notrun" -gt 0 ]; then
            echo "STEP 12A IS NOT COMPLETE."
            exit 0
          fi
          echo "Every in-scope gate is PASS."

      - name: Keep the reading
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step12a-acceptance
          path: acceptance.txt
          if-no-files-found: warn
