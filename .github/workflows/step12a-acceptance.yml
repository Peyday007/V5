tation 16 - product owner, 2026-09-07: "Mutation 15 moved the form, but it still requires me to configure machinery... I authorize the next numbered deployment for this bounded approval-experience correction, with the established release verification." - the Needs You card becomes one prefilled proposal with a single Approve, detailed controls hidden behind Change limits, expiry exactly 2026-10-06T00:00:00.000Z and never rolled forward or widened to the end of a day; and the briefing and nav badge stop saying a person is not needed while an approval gates everything. Implementation reused from a patch the owner supplied (commit a046486, applied unchanged); the status correction and the interaction tests are a5c93a5. No migration, no change to checkAuthority or reserve. See docs/STEP-12A-EVIDENCE.md 52. | mutation 17 - product owner, 2026-09-07, spending the separately reserved scope-pin authorization: "Deploy the authorized scope pin at a safe point; no need to ask me to choose the timing." - ACCEPTANCE_SCOPE.conversationId re-pinned to rcv_02d5312e9d41465a9e0f (S12A-ACC-2) with S12A-ACC-1 moved into PREVIOUS_SCOPES rather than deleted, per scenario 2 5.3. The application change is those two constants plus one `export` keyword: tests/acceptanceGates.test.ts reads the scope from the reporter so that a test cannot supply the standard it is judged against, and it had additionally hardcoded ACC-1's id as the anchor it builds rows against - so re-pinning made the two disagree and three gates read NOT_RUN. Disclosed as part of the scope pin rather than smuggled. No migration, no behaviour change. See docs/STEP-12A-EVIDENCE.md 53. | mutation 18 - product owner, 2026-09-07, under the standing instruction for this sustained task: "Complete the outstanding integration checks, necessary repairs and user controls, then deploy and verify. Do not stop after each component or ask again for permission already granted." - the three defects the live acceptance run found, none of them