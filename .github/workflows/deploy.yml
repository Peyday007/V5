# Deploying the Brain without a terminal.
#
# The product has never needed one: the Brain is a website, and importing,
# auditing, researching and administering all happen in a browser. What still
# needed a terminal was *shipping a new version* — `fly deploy` from a machine
# holding the repository, which meant somebody's laptop. That is a release
# pipeline, and a release pipeline is not the operator's job.
#
# So: GitHub builds and deploys, and a person's whole involvement is pressing
# "Run workflow" in a browser.
#
# ---------------------------------------------------------------------------
# Why a button rather than deploy-on-push
# ---------------------------------------------------------------------------
#
# `workflow_dispatch` only, deliberately. Pushing a commit and changing what is
# running are two different decisions, and this repository gets several commits
# per step — a mid-step push should not become a live deployment of a
# half-finished feature. The test gate below catches code that is broken; it
# cannot catch code that is merely unfinished.
#
# To deploy on every push instead, add:
#
#     push:
#       branches: [production]
#
# under `on:`. One line, and the trade is the paragraph above. Only the
# canonical branch belongs in that list — see `docs/DEPLOYMENT.md`, and the
# `canonical` job below, which refuses every other ref anyway.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What is being deployed, for the run log'
        required: false
        default: 'manual deploy'
      authorize_gap_orchestration:
        description: 'Optional: orchestration id(s) to authorize for RECORD_GAPS, space or comma separated'
        required: false
        default: ''
      authorize_gap_admin:
        description: 'Optional: administrator email the authorization is recorded against'
        required: false
        default: ''
      allow_rollback:
        description: 'Deploy a commit older than the one already released (a deliberate rollback)'
        required: false
        default: 'no'

# Two deploys of one app at once is a race whose loser is whichever image
# finishes second. The second run waits rather than being cancelled: a deploy
# that has already started changing a machine should be allowed to finish.
#
# ---------------------------------------------------------------------------
# This group holds the deploy and nothing else, and that is the whole point
# ---------------------------------------------------------------------------
#
# It used to be `deploy-brain`, shared by sixteen workflows — every operator
# command and every read-only report in the repository. The reason was sound:
# a command must not run against a machine that is being replaced. What the
# group actually implements is something else, and the difference is what did
# the damage: GitHub keeps exactly **one pending run per group**, and the
# newest pending evicts the one that was waiting.
#
# So an unrelated dispatch cancelled a queued deploy. Measured: a queued
# `Deploy` cancelled two seconds after an `Admin` dispatch, `jobs: 0`, never
# started, nothing red anywhere except a conclusion nobody was watching — and
# a silently cancelled deployment leaves the branch and the released image
# disagreeing while every surface looks healthy. It went the other way too:
# four consecutive `Cash report` dispatches cancelled before any of them ran.
#
# A group cannot express priority, so it is not asked to. `Deploy` holds a
# group nothing else is in, so no dispatch of anything can evict it. Every
# console workflow holds a group of its own, so no command evicts a different
# command. And keeping a command off a machine mid-release — the job this
# group was really doing — is `.github/actions/await-release`, which those
# workflows run before they open an ssh session.
concurrency:
  group: brain-release
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # Only one branch may become production
  # -----------------------------------------------------------------------
  #
  # Three branches once deployed to this one Fly app, and each overwrote the
  # last: `/operator` came back twice in one evening because a branch that
  # predated its removal deployed after the branch that removed it. A feature
  # branch reaching production is not a mistake somebody makes once — it is the
  # default behaviour of a dispatchable workflow with no opinion about its ref.
  #
  # So this job runs before anything else and refuses two different things:
  #
  #   * a ref that is not the canonical branch, whatever it contains; and
  #   * the canonical branch when the remote has moved past the checkout, so a
  #     re-run of an old dispatch cannot quietly ship an older tree.
  #
  # **Read this honestly: a guard inside a workflow file cannot bind a branch
  # whose copy of the file predates it.** `workflow_dispatch` runs the workflow
  # from the ref it is dispatched on, so an older branch carries an older
  # deploy.yml and an older deploy.yml has no guard. The control that actually
  # binds every ref is GitHub's own **deployment branch policy** on the
  # `production` environment, which refuses the job before it starts and cannot
  # be edited by the branch being deployed. This job is the fast, legible half;
  # that setting is the enforcing half, and `docs/DEPLOYMENT.md` says how to set
  # it. Neither is a substitute for the other.
  #
  # And read the *timing* honestly too, which is the half that was missing: an
  # answer taken here is an answer about 04:27, and the image is released at
  # 05:30. The same question is asked again in the `deploy` job immediately
  # before `flyctl deploy`, from the same file, because that is the instant it
  # has to be true. See `.github/workflows/canonical-guard.sh`.
  canonical:
    name: Refuse a branch that is not canonical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: This ref must be the canonical branch
        run: |
          .github/workflows/canonical-guard.sh \
            "${{ github.ref_name }}" "${{ github.sha }}" "before the test gate"

  verify:
    needs: canonical
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The same two binaries the runtime image installs.
      #
      # Without them the OCR suite skips itself — cleanly and with a printed
      # reason, which is honest but is not a test run. The image that gets
      # deployed can read a scanned page; a gate that never checks whether the
      # code around that still works is checking a different program from the
      # one being shipped.
      - name: Install the OCR tooling the runtime image has
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1

      # `ci` rather than `install`: the lockfile is the input, and a deploy that
      # resolved a different dependency tree than the one that was tested is not
      # the thing that was tested.
      - run: npm ci

      - run: npm run typecheck

      # The whole suite, against SQLite. The Postgres run needs a server and is
      # a local/pre-merge concern; what this gate exists for is refusing to ship
      # a tree that does not pass its own tests.
      - run: npm test

      # A build failure here is a failed workflow rather than a failed
      # deployment: the image is built again inside Fly, but finding out now
      # costs a minute and finding out there costs a rollback.
      - run: npm run build

  deploy:
    name: Deploy to Fly
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    # Only this job, and only for the release marker below. Every other job
    # here reads.
    permissions:
      contents: write
    env:
      # `secrets` is not one of the contexts an `if:` on a step may read, so
      # whether the optional pre-flight runs is decided here, once, into a
      # plain environment variable it *can* read.
      HAS_DATABASE_URL: ${{ secrets.BRAIN_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The freshness guard below compares commits, so it needs the
          # history to compare them in, and the release marker to compare
          # against. A shallow checkout answers "unrelated histories" to
          # every ancestry question, which is not a refusal and not a pass.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Optional, and off unless the database URL is also a GitHub secret.
      #
      # It reports what the cloud database holds and refuses the deploy if
      # anything would block the migration. It is genuinely useful and it has a
      # genuine cost: it puts the database credential in a second place. That is
      # a decision for a person, so the step is written to do nothing at all
      # when the secret is absent rather than to nag about it.
      - name: Pre-flight against the cloud database
        if: env.HAS_DATABASE_URL == 'true'
        env:
          BRAIN_DATABASE_PROVIDER: postgres
          BRAIN_DATABASE_URL: ${{ secrets.BRAIN_DATABASE_URL }}
        run: |
          npm ci
          npm run preflight

      # --ha=false, for the reason in fly.toml: the extraction and research
      # queues are per-instance and nothing coordinates two of them yet. Step 5
      # adds the claiming and leases that make a second machine safe.
      #
      # And a second attempt on Fly's own builder, because the first one is not
      # Fly's. `--remote-only` routes the build to a Depot builder, and twice in
      # three deploys that builder never completed its handshake:
      #
      #   Waiting for depot builder...
      #   error releasing builder: deadline_exceeded: context deadline exceeded
      #   Error: ... failed to list workers: Unavailable: connection error:
      #   desc = "transport: authentication handshake failed: EOF"
      #
      # flyctl makes two five-minute attempts of its own and then gives up, so
      # the failure has an exact ten-minute signature and says nothing about the
      # commit being deployed. Falling back to `--depot=false` builds on a
      # `fly-builder` machine in the app's own organisation instead — slower,
      # and a machine that has to be provisioned, which is why it is the
      # fallback rather than the default.
      #
      # The fallback is taken only for a builder failure. A build that fails
      # because the code does not compile must fail here, once, rather than be
      # compiled again somewhere else to fail identically.
      # -------------------------------------------------------------------
      # And the question being level with the branch does not answer
      # -------------------------------------------------------------------
      #
      # The step below says this tree is the tip *now*. It does not say this
      # tree is not **older than what is already running**, which is the thing
      # that actually hurts: run 283, 2026-09-21, released `c94bef0` at
      # 01:02:31 and took two merged pull requests off the live Brain.
      # `deployed/production` is a lightweight tag this workflow moves
      # after a release succeeds, so it is Brain's own record of what was last
      # released rather than an inference from a branch. A commit that is a
      # strict ancestor of it is a rollback, and a rollback is refused unless
      # somebody asked for one by name.
      #
      # It is written in git alone, deliberately. Reading the running revision
      # out of `flyctl` would be a better source and a worse dependency: an
      # unverified CLI shape in the one workflow that ships the product is a
      # way to break every deploy in order to prevent a rare one.
      - name: Refuse to overwrite a newer production revision
        env:
          ALLOW_ROLLBACK: ${{ github.event.inputs.allow_rollback }}
        run: |
          set -euo pipefail

          # The release marker. Absent on the first deploy after this landed,
          # which is an absence rather than a pass: it is reported and the
          # branch check above is what stands.
          if git fetch origin --quiet "+refs/tags/deployed/production:refs/tags/deployed/production" 2>/dev/null; then
            released=$(git rev-parse --verify --quiet "refs/tags/deployed/production^{commit}" || true)
          else
            released=""
          fi

          if [ -z "$released" ]; then
            echo "No deployed/production marker yet, so there is nothing to compare against."
            echo "The freshness check below is what stands. Proceeding."
            exit 0
          fi

          echo "last released: $released"
          echo "this tree:     $GITHUB_SHA"

          if [ "$released" = "$GITHUB_SHA" ]; then
            echo "This is the commit already released. Re-releasing it is a no-op on what is running."
            exit 0
          fi

          if git merge-base --is-ancestor "$GITHUB_SHA" "$released"; then
            if [ "${ALLOW_ROLLBACK:-no}" = "yes" ]; then
              echo "::warning::$GITHUB_SHA is older than the released $released. Deploying it anyway, because allow_rollback was set."
              exit 0
            fi
            echo "::error::$GITHUB_SHA is an ancestor of the already-released $released, so this deploy would roll production backwards. If that is what you want, re-dispatch with allow_rollback set to yes."
            exit 1
          fi

          echo "ahead of what is released. Proceeding."

      # The guard again, here rather than only at the top.
      #
      # Everything above this line — the test gate, the install, the
      # pre-flight — takes long enough that the branch can move underneath it,
      # and a run that was legitimately the tip when it started is a rollback
      # if it is not the tip when it ships. Refusing here costs a re-dispatch;
      # not refusing costs production going backwards, which this repository
      # has already paid for twice.
      #
      # It is the same script the `canonical` job runs. Two copies of this rule
      # would drift in the direction nobody sees: the early one fails loudly on
      # every wrong branch, and this one fires only in a race.
      - name: The ref must still be the canonical tip, now
        run: |
          .github/workflows/canonical-guard.sh \
            "${{ github.ref_name }}" "${{ github.sha }}" "immediately before flyctl deploy"

      - name: Deploy
        id: release
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail
          if flyctl deploy --ha=false --remote-only \
               --build-arg BRAIN_REVISION="$GITHUB_SHA" 2>&1 | tee deploy.txt; then
            exit 0
          fi
          if ! grep -qiE 'depot builder|failed to list workers|authentication handshake failed|error releasing builder' deploy.txt; then
            echo "::error::The deploy failed for a reason that is not the builder. Read the output above."
            exit 1
          fi
          if ! flyctl deploy --help 2>&1 | grep -q -- '--depot'; then
            echo "::error::The Depot builder never answered and this flyctl has no --depot flag to fall back to. Re-run the workflow."
            exit 1
          fi
          echo "::warning::The Depot builder never answered. Building on Fly's own remote builder instead."
          flyctl deploy --ha=false --remote-only --depot=false \
            --build-arg BRAIN_REVISION="$GITHUB_SHA"

      # Written after the release rather than before it, because the marker's
      # whole meaning is "this commit is what is running". A marker moved by a
      # deploy that then failed would refuse the very re-deploy that fixes it.
      #
      # `--force` because the marker moves forward with each release and is not
      # history; the history is the commits it has pointed at, which are all
      # still in the branch. It never fails the run: a release that happened is
      # a fact, and losing the note about it must not be reported as losing the
      # release.
      - name: Record what was released
        if: success()
        run: |
          set -euo pipefail
          git tag -f deployed/production "$GITHUB_SHA"
          git push -f origin "refs/tags/deployed/production" || \
            echo "::warning::The release succeeded but the deployed/production marker could not be pushed. The next deploy will fall back to the branch check."

      # When a deploy fails, say why here rather than sending somebody to a
      # dashboard.
      #
      # Brain deliberately stays up and answers 500 to everything — including
      # /healthz — when it cannot migrate its database, because an app that
      # looked healthy with a dead database would have real traffic routed to
      # it. The cost of that correct decision is that the deploy log shows a
      # five-minute health-check timeout and not one word about the cause: the
      # cause is in the application's own log, which is somewhere else.
      #
      # So fetch it. The first failure of this workflow cost a round trip to the
      # Fly dashboard to read a single sentence, and that is the round trip this
      # step exists to remove.
      - name: Why it failed
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::The application's own log"
          # `|| true` throughout: this step is diagnosis, and a diagnosis that
          # fails must not replace the failure it was explaining.
          timeout 60 flyctl logs --no-tail 2>&1 | tail -120 || true
          echo "::endgroup::"
          echo "::group::Machine state"
          flyctl status 2>&1 | tail -40 || true
          echo "::endgroup::"

      # The boot banner, on every run rather than only on a failure.
      #
      # A deploy that succeeds can still leave the Brain in a state nobody
      # wanted — an administrator that was not created, a bootstrap variable
      # that did nothing, a reset that did not fire. All of that is in the
      # application's own log and none of it is in the deploy's exit code, and
      # going to find it cost four rounds of guessing once already.
      #
      # The banner names hosts, buckets and account addresses, and never a
      # credential; that property has tests behind it.
      - name: What the Brain said when it started
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::Boot log"
          sleep 10
          timeout 60 flyctl logs --no-tail 2>&1 | tail -60 || true
          echo "::endgroup::"

      # Liveness only, and unauthenticated on purpose — it is the one endpoint
      # that answers without a credential, and it answers `ok` and nothing else.
      # A deploy that reports success while the machine cannot serve a request
      # is a deploy that reported the wrong thing.
      - name: Wait for it to answer
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          echo "checking https://$app.fly.dev/healthz"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              # And the gate is still shut: everything that is not liveness
              # must refuse an anonymous caller. A deploy that opened the Brain
              # to the internet should fail here rather than be discovered.
              private=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/api/projects" || true)
              if [ "$private" != "401" ]; then
                echo "::error::/api/projects answered $private to an anonymous caller; expected 401"
                exit 1
              fi
              echo "anonymous /api/projects -> 401, as it should be"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz never answered 200"
          exit 1

      # -------------------------------------------------------------------
      # The part a green deploy has never actually proven
      # -------------------------------------------------------------------
      #
      # Everything above says the machine is up and that one anonymous request
      # was refused. Neither says the live Brain's authorization works — that
      # a member of one project cannot reach another, that a worker credential
      # authenticates and a revoked one does not, that a refusal is a 404 and
      # not an oracle. The test suite proves all of it against SQLite on a
      # loopback socket, which is a different program from this one in every
      # way authorization can go wrong.
      #
      # So it is proven here, against the deployment, over the internet.
      #
      # It runs inside the machine because a hosted authorization test needs
      # two things at once: to mint principals, and to arrive from outside.
      # A runner has only the second, and gets the first only by being handed
      # an administrator's password — which would put a live credential in a
      # second system permanently. Inside the container both are free, the
      # fixtures are created and disabled within the run, and every assertion
      # is still made from outside through the edge.
      #
      # **It is not `continue-on-error`, and it used to be.** The argument was
      # that a failure here must not skip the secret removal below — correct,
      # and no longer this step's job to arrange: every step that must survive
      # a failed verification now guards itself with `always() && release ==
      # success`, which is strictly better because it also survives this step
      # crashing rather than failing.
      #
      # What the flag cost was the one thing a person actually reads. It sets
      # the step's *conclusion* to `success` while its `outcome` stays
      # `failure`, so the job summary, the step list and the API all showed a
      # green tick on a verification that had just failed — and the run had to
      # be opened, expanded and read to find out otherwise. The verdict below
      # was always honest about it; nothing above it was.
      #
      # **And it is bounded, because nothing else bounds it.** `flyctl ssh
      # console` keeps a session open with no clock of its own, the step had
      # none, and the job's is GitHub's six-hour default.
      #
      # When that was written every operator workflow shared this run's
      # concurrency group, so a probe that never returned was not a slow deploy
      # but every reading, tick and fleet command queued behind it. The group
      # was split since — each console workflow holds its own — and the cost is
      # smaller rather than gone: they wait for an in-flight release through
      # `.github/actions/await-release`, which is bounded at twenty-five
      # minutes and then warns and proceeds. So an indefinite probe costs every
      # operator command a twenty-five-minute wait instead of a queue with no
      # end, which is still a reason to bound it here.
      #
      # Forty-five minutes is set from the one number that was measured rather
      # than from an incident: run 274's post-restart probe ran **22 minutes**
      # and completed, and the pre-restart probe before it reached the judge
      # step in about ten. Double the longest observed pass leaves a slow one
      # room to finish and still stops an indefinite one.
      #
      # **No such indefinite probe has actually been observed**, and an earlier
      # version of this comment said one had — it claimed run 275 sat here for
      # over an hour. Measured from the run's own timestamps afterwards, that
      # step had been going **5.3 minutes** when it was cancelled, which is
      # ordinary. The bound is a precaution with an argument, not a fix with an
      # incident behind it, and saying otherwise would be inventing the
      # measurement this file exists to insist on.
      - name: Prove the live Brain is actually shut
        id: hosted
        timeout-minutes: 45
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/verify-hosted.sh https://$app.fly.dev --leave-beacon" \
            2>&1 | tee hosted-verification.txt
          set -e
          # The verdict comes from a line the script printed, not from an exit
          # code that had to survive an SSH session, a shell and a CLI.
          if grep -q '^HOSTED-VERIFICATION: PASS' hosted-verification.txt; then
            grep '^HOSTED-VERIFICATION' hosted-verification.txt
            exit 0
          fi
          if ! grep -q '^HOSTED-VERIFICATION' hosted-verification.txt; then
            echo "::error::The hosted verification never ran. If the output above says the SSH connection failed, the Fly token cannot open a console on this app; nothing else in this deploy is affected."
            exit 1
          fi
          echo "::error::The live Brain failed its own authorization checks. The failing lines are above."
          exit 1

      # -------------------------------------------------------------------
      # A bootstrap password is meant to be spent, not kept
      # -------------------------------------------------------------------
      #
      # BRAIN_BOOTSTRAP_ADMIN_PASSWORD exists to get the first account created
      # on a Brain that has none. The moment somebody has signed in, it is a
      # copy of a live password sitting in a deployment store, and the boot log
      # has said so every single time. Leaving the removal to a person means it
      # is still there in six months.
      #
      # Removing a secret restarts the machine, which is the other thing worth
      # having: it is a real, unannounced restart of the production Brain, and
      # the checks below run against what came back. An account that did not
      # survive it would be found here rather than by somebody signing in.
      # `always()` so a failed *verification* cannot leave a live password in
      # the deployment store — but only once a release actually happened. When
      # the build never produced an image there is nothing new running, and the
      # rest of this job must keep its hands off a production machine that is
      # serving the previous version perfectly well.
      - name: Spend the bootstrap secrets
        if: always() && steps.release.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          # `secrets list` prints names and digests, never values.
          present=$(flyctl secrets list --app "$app" 2>/dev/null | awk '{print $1}' \
            | grep -E '^BRAIN_BOOTSTRAP_ADMIN_(EMAIL|PASSWORD|RESET)$' || true)
          if [ -z "$present" ]; then
            echo "No bootstrap secrets are set. Nothing to remove."
            exit 0
          fi
          echo "Removing: $present"
          # shellcheck disable=SC2086
          flyctl secrets unset --app "$app" $present

      # -------------------------------------------------------------------
      # Restart on purpose, not as a side effect
      # -------------------------------------------------------------------
      #
      # The restart used to be a consequence of removing the bootstrap secrets.
      # That worked exactly once. The moment those secrets were gone the step
      # became a no-op, nothing restarted, and the run still printed "either
      # side of a restart" — a claim that decayed into a lie without anybody
      # editing a line, which is the failure mode this whole workflow exists to
      # prevent.
      #
      # So the restart is its own step and always happens. The pass afterwards
      # asserts that the three work items the pass before it left — one queued,
      # one finished, and one with a live lease — are exactly where they were.
      # The process that created them is gone, so nothing in the container can
      # fake that.
      #
      # **`flyctl`'s own wait is not the judge, and three runs in a row proved
      # it.** `flyctl apps restart` waits for health checks with a deadline
      # shorter than this machine's cold start: it printed five minutes of
      # `Waiting for … to become healthy (started, 0/1)`, exited 126 with
      # `context deadline exceeded`, and the very next step answered
      # `healthy again after 1 attempt(s)` twenty-four seconds later. The
      # machine was already back. But a failing step with no `if:` skips every
      # step after it, so `after the restart: skipped` — three deploys running,
      # the post-restart verification not failing but *not running at all*.
      #
      # That is the erosion worth naming: a gate that never runs stops being
      # evidence long before anybody notices, and re-deploying is the wrong
      # answer to it — the image is live, and a re-deploy restarts a Brain
      # holding leased work to re-prove what the pre-restart pass already
      # proved.
      #
      # So the wait below is the judge, because it polls the public URL from
      # outside the machine and is what the next step actually depends on. This
      # step tolerates *exactly* the health-check deadline and nothing else —
      # the same shape as the Depot fallback in the Deploy step, and for the
      # same reason: a failure that says nothing about the commit must not read
      # like one that does. A restart refused for any other reason still fails
      # here, once.
      - name: Restart it, so persistence means something
        if: always() && steps.release.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set -o pipefail
          if flyctl apps restart "$app" 2>&1 | tee restart.txt; then
            exit 0
          fi
          if grep -qiE 'failed to wait for health checks|context deadline exceeded' restart.txt; then
            echo "::warning::flyctl gave up waiting for health checks. The machine was asked to restart; whether it came back is decided by the next step, which polls the public URL."
            exit 0
          fi
          echo "::error::The restart was refused for a reason that is not the health-check wait. Read the output above."
          exit 1

      - name: Wait for it to answer after the restart
        if: always() && steps.release.outcome == 'success'
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "healthy again after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz never answered 200 after the restart"
          exit 1

      # The same checks a second time, against a Brain that has just been
      # restarted with its bootstrap secrets gone. Accounts, memberships,
      # workers and credentials live in Postgres, so they must all still be
      # exactly where they were — and if they are not, this is where that is
      # discovered.
      - name: Prove it survived the restart
        id: hosted_after
        # Bounded for the reason the pre-restart probe is, and this is the step
        # that demonstrated the need.
        timeout-minutes: 45
        # `always()` because the step before it may have failed, and this one
        # answers a different question: the pre-restart pass says what the new
        # image refuses, this says what survived. A restart nobody checked is
        # the erosion the restart step's own comment describes.
        #
        # It does depend on that pass in one way — `--leave-beacon` is what
        # `--check-beacon` looks for — so a pre-restart failure early enough to
        # skip the beacon makes this fail for a *derived* reason. That is why
        # the verdict prints both files' own failure lines rather than a count:
        # two red steps with one cause must not read as two causes.
        if: always() && steps.release.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/verify-hosted.sh https://$app.fly.dev --check-beacon" \
            2>&1 | tee hosted-after-restart.txt
          set -e
          grep -q '^HOSTED-VERIFICATION: PASS' hosted-after-restart.txt

      # Neither verification step is `continue-on-error` any more: a failed
      # check reads as failed, and the steps that must still run say so
      # themselves. The run's verdict is still decided below, and it is still
      # the only thing that decides it.
      # -------------------------------------------------------------------
      # A one-packet authorization, run from the release pipeline
      # -------------------------------------------------------------------
      #
      # Recording an unresolved gap narrows what a packet claims to answer, so
      # it is a decision a person makes about one orchestration rather than a
      # default the runner applies when it is stuck. The decision reaches the
      # database here because this pipeline is the established way into the
      # container, and because handing a shell operation back to the operator is
      # how a recovery ends up unreachable.
      #
      # Skipped on every deploy that does not name a packet, which is all of
      # them but the one. Idempotent by the packet's own state: a repeat run
      # reports the authorization that already exists and rewrites neither its
      # author nor its timestamp.
      #
      # `always()` for the reason the two steps above it carry one: this is a
      # decision somebody made about one packet, it is idempotent, and it has
      # nothing to do with whether the hosted gate passed. Letting a failed
      # probe skip it silently would be an authorization that looks applied and
      # is not — which is worse than either outcome on its own.
      #
      # **More than one, because a programme parks more than one.** The live
      # manufacturing programme runs three packets at a time and two of them
      # were `NEEDS_HUMAN` at once, each holding a concurrency slot no worker
      # could ever free — so a step that authorizes exactly one packet answers
      # half a deadlock and leaves the programme stopped. Two full deploys is
      # the alternative and it restarts a Brain holding leased work twice to
      # apply two idempotent writes.
      #
      # Each id is authorized by its own call and each one's `GAP-POLICY: OK`
      # is required, so a list where one id is wrong fails the step naming that
      # id rather than reporting the ones that worked. The ids are validated
      # against the shape the database uses before anything is sent, because
      # they are interpolated into a remote command line.
      - name: Authorize packets for RECORD_GAPS
        if: >-
          always() && steps.release.outcome == 'success'
          && inputs.authorize_gap_orchestration != ''
          && inputs.authorize_gap_admin != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GAP_ORCHESTRATIONS: ${{ inputs.authorize_gap_orchestration }}
          GAP_ADMIN: ${{ inputs.authorize_gap_admin }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          failed=''
          for orc in $(echo "$GAP_ORCHESTRATIONS" | tr ',' ' '); do
            # Exact rather than a prefix glob: `orc_[0-9a-f]*` accepts
            # `orc_b` and anything after it, which is not a validation.
            if ! printf '%s' "$orc" | grep -qE '^orc_[0-9a-f]{20}$'; then
              echo "::error::\"$orc\" is not an orchestration id. Nothing was sent for it."
              failed="$failed $orc"
              continue
            fi
            echo "--- $orc ---"
            set +e
            flyctl ssh console --app "$app" \
              -C "sh /app/scripts/authorize-gap-policy.sh --orchestration $orc --admin $GAP_ADMIN" \
              2>&1 | tee "gap-policy-$orc.txt"
            set -e
            grep -q '^GAP-POLICY: OK' "gap-policy-$orc.txt" || failed="$failed $orc"
          done
          if [ -n "$failed" ]; then
            echo "::error::The gap-policy authorization did not take for:$failed. Read the output above."
            exit 1
          fi

      # The release is asked about first, and separately.
      #
      # When the builder failed, every step that could have proven anything was
      # skipped, and this step reported "the hosted verification did not pass" —
      # true, useless, and pointing at the wrong steps. Worse, the restart above
      # used to run anyway, so the machine came back healthy on the *previous*
      # image and the site looked entirely fine while running stale code. A red
      # run nobody can read is how that gets missed.
      - name: The verdict
        if: always()
        run: |
          release='${{ steps.release.outcome }}'
          before='${{ steps.hosted.outcome }}'
          after='${{ steps.hosted_after.outcome }}'
          echo "release:             $release"
          echo "hosted verification: $before"
          echo "after the restart:   $after"
          if [ "$release" != "success" ]; then
            # Not "still serving the previous version": with one machine and a
            # rolling update, a release that fails its health check has
            # usually already replaced the machine's image — Deploy #319's
            # machine table read the new version, started, 1 critical. What
            # is certain is only that this commit was not proved healthy.
            echo "::error::The release did not complete, so this commit was never proved healthy. The machine may already be running its image unhealthily rather than the previous version: 'Machine state' and 'Boot log' above say which, and why. The checks below it were skipped on purpose."
            exit 1
          fi
          # Name the condition, not the step. "Read the two steps above" is
          # true and sends somebody to scroll through six hundred passing
          # lines; the verification prints its own verdict line and the
          # failures beneath it, so those are what this repeats. A verdict that
          # carries its evidence is the difference between a red run somebody
          # reads and one somebody re-runs.
          failing=''
          for pass in "before the restart:$before:hosted-verification.txt" "after the restart:$after:hosted-after-restart.txt"; do
            when=${pass%%:*}
            rest=${pass#*:}
            outcome=${rest%%:*}
            file=${rest#*:}
            [ "$outcome" = 'success' ] && continue
            failing="$failing${failing:+, }$when"
            echo "--- $when, from $file ---"
            if [ ! -s "$file" ]; then
              echo "(no output was captured: the check did not run, or the console never opened)"
              continue
            fi
            grep '^HOSTED-VERIFICATION' "$file" || echo "(it never printed a verdict line)"
            grep -E '^ *(FAIL|Hosted verification could not complete)' "$file" | head -20 \
              || echo "(no FAIL line: read the step for what it did print)"
          done
          if [ -n "$failing" ]; then
            echo "::error::The hosted verification did not pass ($failing). The failing conditions are printed directly above."
            exit 1
          fi
          echo "The live Brain refused everything it should have, twice, either side of a real restart,"
          echo "and the work left before it was still there afterwards."

      # -------------------------------------------------------------------
      # The record, so something other than a person can read this verdict
      # -------------------------------------------------------------------
      #
      # Step 12B's gate P asks whether the hosted verification passed either
      # side of a real restart — condition R13 — and a reporter running in a
      # checkout cannot attest a CI run it did not observe. Reading this
      # workflow file would check that the steps are *written down*, not that
      # they passed, which is the class of evidence the acceptance reporter
      # refuses everywhere else.
      #
      # So the run writes down what it proved, stamped with the revision it
      # proved it at, and the reporter consumes that. Uploaded rather than
      # committed: this job holds the deployment credential and must not be
      # able to push to the branch it just deployed.
      - name: Record what this run proved, for the acceptance reporter
        if: always()
        run: |
          mkdir -p docs/evidence/step12b-hosted
          cat > docs/evidence/step12b-hosted/verification.json <<JSON
          {
            "revision": "${GITHUB_SHA}",
            "ranAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "beforeRestart": ${{ steps.hosted.outcome == 'success' }},
            "afterRestart": ${{ steps.hosted_after.outcome == 'success' }},
            "workflowRun": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          JSON
          cat docs/evidence/step12b-hosted/verification.json

      - name: Keep it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step12b-hosted-verification
          path: docs/evidence/step12b-hosted/verification.json
          if-no-files-found: warn
