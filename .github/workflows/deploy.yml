# Deploying the Brain without a terminal.
#
# The product has never needed one: the Brain is a website, and importing,
# auditing, researching and administering all happen in a browser. What still
# needed a terminal was *shipping a new version* — `fly deploy` from a machine
# holding the repository, which meant somebody's laptop. That is a release
# pipeline, and a release pipeline is not the operator's job.
#
# So: GitHub builds and deploys, and a person's whole involvement is pressing
# "Run workflow" in a browser.
#
# ---------------------------------------------------------------------------
# Why a button rather than deploy-on-push
# ---------------------------------------------------------------------------
#
# `workflow_dispatch` only, deliberately. Pushing a commit and changing what is
# running are two different decisions, and this repository gets several commits
# per step — a mid-step push should not become a live deployment of a
# half-finished feature. The test gate below catches code that is broken; it
# cannot catch code that is merely unfinished.
#
# To deploy on every push instead, add:
#
#     push:
#       branches: [claude/zealous-hypatia-78a2yp]
#
# under `on:`. One line, and the trade is the paragraph above.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'What is being deployed, for the run log'
        required: false
        default: 'manual deploy'
      authorize_gap_orchestration:
        description: 'Optional: orchestration id to authorize for RECORD_GAPS (one packet, once)'
        required: false
        default: ''
      authorize_gap_admin:
        description: 'Optional: administrator email the authorization is recorded against'
        required: false
        default: ''

# Two deploys of one app at once is a race whose loser is whichever image
# finishes second. The second run waits rather than being cancelled: a deploy
# that has already started changing a machine should be allowed to finish.
concurrency:
  group: deploy-brain
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The same two binaries the runtime image installs.
      #
      # Without them the OCR suite skips itself — cleanly and with a printed
      # reason, which is honest but is not a test run. The image that gets
      # deployed can read a scanned page; a gate that never checks whether the
      # code around that still works is checking a different program from the
      # one being shipped.
      - name: Install the OCR tooling the runtime image has
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-eng
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1

      # `ci` rather than `install`: the lockfile is the input, and a deploy that
      # resolved a different dependency tree than the one that was tested is not
      # the thing that was tested.
      - run: npm ci

      - run: npm run typecheck

      # The whole suite, against SQLite. The Postgres run needs a server and is
      # a local/pre-merge concern; what this gate exists for is refusing to ship
      # a tree that does not pass its own tests.
      - run: npm test

      # A build failure here is a failed workflow rather than a failed
      # deployment: the image is built again inside Fly, but finding out now
      # costs a minute and finding out there costs a rollback.
      - run: npm run build

  deploy:
    name: Deploy to Fly
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      # `secrets` is not one of the contexts an `if:` on a step may read, so
      # whether the optional pre-flight runs is decided here, once, into a
      # plain environment variable it *can* read.
      HAS_DATABASE_URL: ${{ secrets.BRAIN_DATABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Optional, and off unless the database URL is also a GitHub secret.
      #
      # It reports what the cloud database holds and refuses the deploy if
      # anything would block the migration. It is genuinely useful and it has a
      # genuine cost: it puts the database credential in a second place. That is
      # a decision for a person, so the step is written to do nothing at all
      # when the secret is absent rather than to nag about it.
      - name: Pre-flight against the cloud database
        if: env.HAS_DATABASE_URL == 'true'
        env:
          BRAIN_DATABASE_PROVIDER: postgres
          BRAIN_DATABASE_URL: ${{ secrets.BRAIN_DATABASE_URL }}
        run: |
          npm ci
          npm run preflight

      # --ha=false, for the reason in fly.toml: the extraction and research
      # queues are per-instance and nothing coordinates two of them yet. Step 5
      # adds the claiming and leases that make a second machine safe.
      - name: Deploy
        run: flyctl deploy --ha=false --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # When a deploy fails, say why here rather than sending somebody to a
      # dashboard.
      #
      # Brain deliberately stays up and answers 500 to everything — including
      # /healthz — when it cannot migrate its database, because an app that
      # looked healthy with a dead database would have real traffic routed to
      # it. The cost of that correct decision is that the deploy log shows a
      # five-minute health-check timeout and not one word about the cause: the
      # cause is in the application's own log, which is somewhere else.
      #
      # So fetch it. The first failure of this workflow cost a round trip to the
      # Fly dashboard to read a single sentence, and that is the round trip this
      # step exists to remove.
      - name: Why it failed
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::The application's own log"
          # `|| true` throughout: this step is diagnosis, and a diagnosis that
          # fails must not replace the failure it was explaining.
          timeout 60 flyctl logs --no-tail 2>&1 | tail -120 || true
          echo "::endgroup::"
          echo "::group::Machine state"
          flyctl status 2>&1 | tail -40 || true
          echo "::endgroup::"

      # The boot banner, on every run rather than only on a failure.
      #
      # A deploy that succeeds can still leave the Brain in a state nobody
      # wanted — an administrator that was not created, a bootstrap variable
      # that did nothing, a reset that did not fire. All of that is in the
      # application's own log and none of it is in the deploy's exit code, and
      # going to find it cost four rounds of guessing once already.
      #
      # The banner names hosts, buckets and account addresses, and never a
      # credential; that property has tests behind it.
      - name: What the Brain said when it started
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "::group::Boot log"
          sleep 10
          timeout 60 flyctl logs --no-tail 2>&1 | tail -60 || true
          echo "::endgroup::"

      # Liveness only, and unauthenticated on purpose — it is the one endpoint
      # that answers without a credential, and it answers `ok` and nothing else.
      # A deploy that reports success while the machine cannot serve a request
      # is a deploy that reported the wrong thing.
      - name: Wait for it to answer
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          echo "checking https://$app.fly.dev/healthz"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              # And the gate is still shut: everything that is not liveness
              # must refuse an anonymous caller. A deploy that opened the Brain
              # to the internet should fail here rather than be discovered.
              private=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/api/projects" || true)
              if [ "$private" != "401" ]; then
                echo "::error::/api/projects answered $private to an anonymous caller; expected 401"
                exit 1
              fi
              echo "anonymous /api/projects -> 401, as it should be"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz never answered 200"
          exit 1

      # -------------------------------------------------------------------
      # The part a green deploy has never actually proven
      # -------------------------------------------------------------------
      #
      # Everything above says the machine is up and that one anonymous request
      # was refused. Neither says the live Brain's authorization works — that
      # a member of one project cannot reach another, that a worker credential
      # authenticates and a revoked one does not, that a refusal is a 404 and
      # not an oracle. The test suite proves all of it against SQLite on a
      # loopback socket, which is a different program from this one in every
      # way authorization can go wrong.
      #
      # So it is proven here, against the deployment, over the internet.
      #
      # It runs inside the machine because a hosted authorization test needs
      # two things at once: to mint principals, and to arrive from outside.
      # A runner has only the second, and gets the first only by being handed
      # an administrator's password — which would put a live credential in a
      # second system permanently. Inside the container both are free, the
      # fixtures are created and disabled within the run, and every assertion
      # is still made from outside through the edge.
      #
      # `continue-on-error` so that a failure here does not skip the secret
      # removal below; the run is still failed, explicitly, at the end.
      - name: Prove the live Brain is actually shut
        id: hosted
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/verify-hosted.sh https://$app.fly.dev --leave-beacon" \
            2>&1 | tee hosted-verification.txt
          set -e
          # The verdict comes from a line the script printed, not from an exit
          # code that had to survive an SSH session, a shell and a CLI.
          if grep -q '^HOSTED-VERIFICATION: PASS' hosted-verification.txt; then
            grep '^HOSTED-VERIFICATION' hosted-verification.txt
            exit 0
          fi
          if ! grep -q '^HOSTED-VERIFICATION' hosted-verification.txt; then
            echo "::error::The hosted verification never ran. If the output above says the SSH connection failed, the Fly token cannot open a console on this app; nothing else in this deploy is affected."
            exit 1
          fi
          echo "::error::The live Brain failed its own authorization checks. The failing lines are above."
          exit 1

      # -------------------------------------------------------------------
      # A bootstrap password is meant to be spent, not kept
      # -------------------------------------------------------------------
      #
      # BRAIN_BOOTSTRAP_ADMIN_PASSWORD exists to get the first account created
      # on a Brain that has none. The moment somebody has signed in, it is a
      # copy of a live password sitting in a deployment store, and the boot log
      # has said so every single time. Leaving the removal to a person means it
      # is still there in six months.
      #
      # Removing a secret restarts the machine, which is the other thing worth
      # having: it is a real, unannounced restart of the production Brain, and
      # the checks below run against what came back. An account that did not
      # survive it would be found here rather than by somebody signing in.
      - name: Spend the bootstrap secrets
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          # `secrets list` prints names and digests, never values.
          present=$(flyctl secrets list --app "$app" 2>/dev/null | awk '{print $1}' \
            | grep -E '^BRAIN_BOOTSTRAP_ADMIN_(EMAIL|PASSWORD|RESET)$' || true)
          if [ -z "$present" ]; then
            echo "No bootstrap secrets are set. Nothing to remove."
            exit 0
          fi
          echo "Removing: $present"
          # shellcheck disable=SC2086
          flyctl secrets unset --app "$app" $present

      # -------------------------------------------------------------------
      # Restart on purpose, not as a side effect
      # -------------------------------------------------------------------
      #
      # The restart used to be a consequence of removing the bootstrap secrets.
      # That worked exactly once. The moment those secrets were gone the step
      # became a no-op, nothing restarted, and the run still printed "either
      # side of a restart" — a claim that decayed into a lie without anybody
      # editing a line, which is the failure mode this whole workflow exists to
      # prevent.
      #
      # So the restart is its own step and always happens. The pass afterwards
      # asserts that the three work items the pass before it left — one queued,
      # one finished, and one with a live lease — are exactly where they were.
      # The process that created them is gone, so nothing in the container can
      # fake that.
      - name: Restart it, so persistence means something
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          flyctl apps restart "$app"

      - name: Wait for it to answer after the restart
        if: always()
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$app.fly.dev/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "healthy again after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/healthz never answered 200 after the restart"
          exit 1

      # The same checks a second time, against a Brain that has just been
      # restarted with its bootstrap secrets gone. Accounts, memberships,
      # workers and credentials live in Postgres, so they must all still be
      # exactly where they were — and if they are not, this is where that is
      # discovered.
      - name: Prove it survived the restart
        id: hosted_after
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/verify-hosted.sh https://$app.fly.dev --check-beacon" \
            2>&1 | tee hosted-after-restart.txt
          set -e
          grep -q '^HOSTED-VERIFICATION: PASS' hosted-after-restart.txt

      # Both verification steps are `continue-on-error` so that neither can skip
      # the secret removal. The run's verdict is decided here instead.
      # -------------------------------------------------------------------
      # A one-packet authorization, run from the release pipeline
      # -------------------------------------------------------------------
      #
      # Recording an unresolved gap narrows what a packet claims to answer, so
      # it is a decision a person makes about one orchestration rather than a
      # default the runner applies when it is stuck. The decision reaches the
      # database here because this pipeline is the established way into the
      # container, and because handing a shell operation back to the operator is
      # how a recovery ends up unreachable.
      #
      # Skipped on every deploy that does not name a packet, which is all of
      # them but the one. Idempotent by the packet's own state: a repeat run
      # reports the authorization that already exists and rewrites neither its
      # author nor its timestamp.
      - name: Authorize one packet for RECORD_GAPS
        if: inputs.authorize_gap_orchestration != '' && inputs.authorize_gap_admin != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 '^app = ' fly.toml | cut -d'"' -f2)
          set +e
          flyctl ssh console --app "$app" \
            -C "sh /app/scripts/authorize-gap-policy.sh --orchestration ${{ inputs.authorize_gap_orchestration }} --admin ${{ inputs.authorize_gap_admin }}" \
            2>&1 | tee gap-policy.txt
          set -e
          grep -q '^GAP-POLICY: OK' gap-policy.txt

      - name: The verdict
        if: always()
        run: |
          before='${{ steps.hosted.outcome }}'
          after='${{ steps.hosted_after.outcome }}'
          echo "hosted verification: $before"
          echo "after the restart:   $after"
          if [ "$before" != "success" ] || [ "$after" != "success" ]; then
            echo "::error::The hosted verification did not pass. Read the two steps above."
            exit 1
          fi
          echo "The live Brain refused everything it should have, twice, either side of a real restart,"
          echo "and the work left before it was still there afterwards."
